<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOMADA Documentation</title>
<meta name="description" content="SOMADA: A Web-Based Laboratory Management System — project documentation (MSYADD1)." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f4; --paper:#ffffff; --ink:#1f2430; --ink-soft:#5b6270; --ink-faint:#8a90a0;
    --line:#e3e6ec; --line-strong:#cfd4dd;
    --accent:#5b47e0; --accent-ink:#4433b8; --accent-soft:#efecfd;
    --sidebar-bg:#fbfbfd; --head-bg:#f6f6fa;
    --must-bg:#fdecea; --must-ink:#b3261e;
    --should-bg:#e8f0fe; --should-ink:#1a56c4;
    --st-neutral-bg:#eef0f4; --st-neutral-ink:#5b6270;
    --st-progress-bg:#fff4e0; --st-progress-ink:#a15c00;
    --st-done-bg:#e6f6ec; --st-done-ink:#1a7d3f;
    --st-blocked-bg:#fdecea; --st-blocked-ink:#b3261e;
    --shadow:0 1px 2px rgba(20,20,43,.05), 0 10px 30px rgba(20,20,43,.07);
    --radius:12px;
    --chrome-h:99px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;color:var(--ink);line-height:1.25;margin:0;}
  p{margin:0 0 12px;}
  ul,ol{margin:0 0 12px;padding-left:22px;}
  li{margin-bottom:6px;}
  a{color:var(--accent-ink);}
  button{font-family:inherit;}
  ::selection{background:#d7cdfb;}

  /* ---------- chrome: progress + topbar ---------- */
  .progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#8f7bff);width:0%;z-index:70;transition:width .1s linear;}
  .topbar{position:fixed;top:3px;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:60;gap:12px;}
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .page-tabs{position:fixed;top:59px;left:0;right:0;height:40px;background:#fbfbfd;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 16px;z-index:59;overflow-x:auto;}
  .page-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex:0 0 auto;}
  .page-tab:hover{background:#eef0f4;color:var(--ink);}
  .page-tab.active{background:var(--accent-soft);color:var(--accent-ink);}
  .topbar-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  a.icon-btn{text-decoration:none;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .brand-badge{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-title{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;}
  .brand-sub{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;height:36px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:600;}
  .icon-btn:hover{background:var(--head-bg);color:var(--ink);}
  .icon-btn svg{width:16px;height:16px;}
  .menu-toggle{display:none;width:36px;padding:0;}
  .menu-toggle svg{width:18px;height:18px;}

  /* ---------- layout shell ---------- */
  .shell{display:flex;}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(20,20,43,.35);z-index:45;}
  .sidebar{position:fixed;top:var(--chrome-h);left:0;bottom:0;width:300px;background:var(--sidebar-bg);border-right:1px solid var(--line);overflow-y:auto;z-index:50;padding:14px 10px 40px;}
  .sidebar-search{position:relative;margin:2px 4px 12px;}
  .sidebar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);}
  .sidebar-search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;padding:0 10px 0 32px;font-size:13px;color:var(--ink);outline:none;}
  .sidebar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sidebar-search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;background:#f8f8fb;}
  .doc-chip{display:flex;align-items:center;gap:8px;margin:0 4px 10px;padding:8px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .doc-chip span.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .nav-empty{padding:14px 10px;font-size:12.5px;color:var(--ink-faint);}

  .nav-list{list-style:none;margin:0;padding:0;}
  .nav-row{display:flex;align-items:stretch;border-left:3px solid transparent;border-radius:0 8px 8px 0;margin:1px 0;}
  .nav-row.active{border-left-color:var(--accent);background:var(--accent-soft);}
  .nav-row.active>.nav-label .nav-text{color:var(--accent-ink);font-weight:700;}
  .nav-label{flex:1;display:flex;align-items:center;gap:7px;min-width:0;background:none;border:none;text-align:left;padding:7px 8px;font-size:13px;color:var(--ink-soft);cursor:pointer;border-radius:8px;}
  .nav-label:hover{background:#f0f0f7;color:var(--ink);}
  .nav-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-page{margin-left:auto;font-size:10.5px;color:var(--ink-faint);flex:0 0 auto;padding-left:6px;}
  .nav-chevron{width:26px;flex:0 0 auto;background:none;border:none;color:var(--ink-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;}
  .nav-chevron:hover{background:#e9e9f2;color:var(--ink);}
  .nav-chevron svg{width:13px;height:13px;transition:transform .15s ease;}
  .nav-chevron.open svg{transform:rotate(90deg);}

  .content-wrap{flex:1;margin-left:300px;margin-top:var(--chrome-h);min-width:0;padding:32px 20px 120px;}
  .paper{max-width:860px;margin:0 auto;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:56px 64px;}
  .doc-section{scroll-margin-top:75px;padding-top:6px;}
  .doc-section + .doc-section{margin-top:46px;padding-top:32px;border-top:1px solid var(--line);}
  .doc-section.sub{margin-top:34px;padding-top:0;border-top:none;}

  /* ---------- headings ---------- */
  .section-heading{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .section-heading h2{font-size:26px;}
  .section-heading h3{font-size:20px;}
  .section-heading h4{font-size:16.5px;}
  .kicker{font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:.03em;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;vertical-align:middle;margin-right:8px;}
  .anchor-link{opacity:0;text-decoration:none;color:var(--ink-faint);font-family:'Inter',sans-serif;font-weight:400;font-size:14px;transition:opacity .1s;}
  .section-heading:hover .anchor-link{opacity:1;}
  .cap{font-family:'Source Serif 4',serif;font-style:italic;color:var(--ink-soft);font-size:14px;margin:-4px 0 16px;}
  .lede{font-family:'Source Serif 4',serif;font-size:16px;line-height:1.7;color:var(--ink);}
  .lede p{margin:0 0 15px;}

  /* ---------- cover ---------- */
  .cover{text-align:center;padding:30px 0 10px;}
  .cover .kicker-line{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:22px;}
  .cover h1{font-size:30px;line-height:1.35;margin-bottom:30px;}
  .cover .meta-block{font-family:'Source Serif 4',serif;font-size:15px;color:var(--ink-soft);line-height:2;margin:26px 0;}
  .cover .meta-block strong{color:var(--ink);}
  .authors{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;max-width:520px;margin:26px auto 0;font-family:'Source Serif 4',serif;font-size:15.5px;}
  .authors div{padding:4px 0;}

  /* ---------- TOC ---------- */
  .toc-list{list-style:none;margin:0;padding:0;font-family:'Source Serif 4',serif;font-size:15.5px;}
  .toc-list li{margin-bottom:2px;}
  .toc-row{display:flex;align-items:baseline;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer;text-decoration:none;color:var(--ink);}
  .toc-row:hover{background:var(--head-bg);}
  .toc-row.indent{padding-left:26px;font-size:14.5px;color:var(--ink-soft);}
  .toc-label{white-space:nowrap;}
  .toc-fill{flex:1;border-bottom:1.5px dotted var(--line-strong);position:relative;top:-4px;margin:0 4px;}
  .toc-page{color:var(--ink-faint);font-size:13.5px;font-family:'Inter',sans-serif;}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0 6px;}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.3px;font-family:'Inter',sans-serif;min-width:640px;}
  table.tbl th{background:var(--head-bg);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line-strong);font-weight:700;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink);}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tr:hover td{background:#fbfbfe;}

  .priority-badge,.status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .priority-must{background:var(--must-bg);color:var(--must-ink);}
  .priority-should{background:var(--should-bg);color:var(--should-ink);}
  .status-neutral{background:var(--st-neutral-bg);color:var(--st-neutral-ink);}
  .status-progress{background:var(--st-progress-bg);color:var(--st-progress-ink);}
  .status-done{background:var(--st-done-bg);color:var(--st-done-ink);}
  .status-blocked{background:var(--st-blocked-bg);color:var(--st-blocked-ink);}

  /* ---------- figures ---------- */
  .doc-figure{margin:18px 0 8px;text-align:center;}
  .figure-frame{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfbfd;cursor:zoom-in;}
  .figure-frame img{display:block;max-width:100%;height:auto;max-height:560px;object-fit:contain;margin:0 auto;}
  .zoom-hint{position:absolute;right:8px;bottom:8px;background:rgba(31,36,48,.78);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .12s;}
  .zoom-hint svg{width:11px;height:11px;}
  .figure-frame:hover .zoom-hint{opacity:1;}
  figcaption{font-family:'Source Serif 4',serif;font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-top:10px;}

  /* ---------- use case cards ---------- */
  .usecase-card{background:#fcfcfe;border:1px solid var(--line);border-radius:12px;padding:26px 28px;}
  .usecase-head{margin-bottom:14px;}
  .usecase-table-tag{display:inline-block;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-bottom:6px;}
  .usecase-head h4{font-size:19px;}
  .usecase-subtitle{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink-faint);margin-top:3px;}
  dl.usecase-meta{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;margin:16px 0 20px;font-size:14px;}
  dl.usecase-meta dt{font-family:'Inter',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);padding-top:2px;}
  dl.usecase-meta dd{margin:0;font-family:'Source Serif 4',serif;line-height:1.6;color:var(--ink);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:'Inter',sans-serif;font-size:12px;background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .usecase-card h5{font-family:'Inter',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;margin:20px 0 8px;}
  .stakeholder-list,.check-list{list-style:none;padding:0;margin:0 0 4px;font-size:14px;}
  .stakeholder-list li,.check-list li{position:relative;padding-left:18px;margin-bottom:8px;font-family:'Source Serif 4',serif;line-height:1.55;}
  .stakeholder-list li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .check-list li::before{content:"✓";position:absolute;left:0;top:0;color:var(--st-done-ink);font-weight:700;font-family:'Inter',sans-serif;font-size:12.5px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
  .flow-table{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .flow-col{padding:14px 18px;}
  .flow-col:first-child{border-right:1px solid var(--line);}
  .flow-col-head{font-family:'Inter',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent-ink);margin-bottom:8px;}
  .flow-col ol{margin:0;padding-left:18px;font-family:'Source Serif 4',serif;font-size:13.8px;line-height:1.55;}
  .flow-col li{margin-bottom:9px;}
  .exception-list{list-style:none;padding:0;margin:0;}
  .exception-list li{font-family:'Source Serif 4',serif;font-size:14px;line-height:1.6;background:#fff8ec;border-left:3px solid #e8ac2e;padding:9px 14px;border-radius:0 8px 8px 0;margin-bottom:8px;}

  /* ---------- entities reference (ERD) ---------- */
  .entity-note{font-size:12.5px;color:var(--ink-faint);font-family:'Inter',sans-serif;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .entity-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .entity-card{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fcfcfe;}
  .entity-card .ename{font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;color:var(--accent-ink);margin-bottom:4px;letter-spacing:.02em;}
  .entity-card .efields{font-size:12px;color:var(--ink-soft);line-height:1.5;font-family:'Inter',sans-serif;}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(15,16,24,.86);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;background:#fff;}
  .lightbox-caption{color:#e7e7ee;font-family:'Source Serif 4',serif;font-style:italic;margin-top:16px;font-size:14px;text-align:center;max-width:700px;}
  .lightbox-close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-close svg{width:18px;height:18px;}

  /* ---------- footer / back-to-top ---------- */
  .doc-footer{margin-top:50px;padding-top:22px;border-top:1px solid var(--line);font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-faint);line-height:1.7;}
  .back-to-top{position:fixed;right:26px;bottom:26px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line-strong);box-shadow:var(--shadow);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;}
  .back-to-top.show{opacity:1;pointer-events:auto;}
  .back-to-top:hover{color:var(--accent-ink);transform:translateY(-2px);}
  .back-to-top svg{width:18px;height:18px;}

  /* ---------- responsive ---------- */
  @media (max-width:980px){
    .menu-toggle{display:inline-flex;}
    .sidebar{left:-320px;transition:left .22s ease;box-shadow:0 0 40px rgba(0,0,0,.15);}
    .sidebar.open{left:0;}
    .sidebar-scrim.show{display:block;}
    .content-wrap{margin-left:0;padding:24px 14px 100px;}
    .paper{padding:34px 22px;}
    .brand-sub{display:none;}
    .topbar-right .icon-btn span{display:none;}
    .topbar-right .icon-btn{width:36px;padding:0;justify-content:center;}
    dl.usecase-meta{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
    .flow-table{grid-template-columns:1fr;}
    .flow-col:first-child{border-right:none;border-bottom:1px solid var(--line);}
    .entity-grid{grid-template-columns:1fr;}
    .authors{grid-template-columns:1fr;text-align:center;}
  }

  /* ---------- print: real A4 pagination ---------- */
  /* Page-number footer: cover is unnumbered ("page 0"), numbering becomes
     visible starting at 1 on the Table of Contents page, then 2, 3, 4... */
  @page{
    size: A4;
    margin: 20mm 18mm;
    @bottom-center{
      content: counter(page);
      font-family: 'Inter', sans-serif;
      font-size: 9pt;
      color: #9a9fab;
    }
  }
  @page :first{
    counter-reset: page 0;
    @bottom-center{ content: none; }
  }
  @media print{
    html,body{background:#fff;width:auto;height:auto;}
    .progress-bar,.topbar,.page-tabs,.sidebar,.sidebar-scrim,.zoom-hint,.anchor-link,.back-to-top,.sidebar-search kbd{display:none !important;}
    .content-wrap{margin:0 !important;padding:0 !important;}
    .paper{box-shadow:none;border-radius:0;max-width:none;width:auto;padding:0;}

    body{font-size:10.5pt;line-height:1.42;}
    h1{font-size:21pt;}
    h2{font-size:16pt;}
    h3{font-size:13.5pt;}
    h4{font-size:12pt;}
    h5{font-size:9.5pt;margin:9pt 0 4pt !important;}
    .cap,.lede,dl.usecase-meta dd,.stakeholder-list li,.check-list li,.flow-col ol,.exception-list li{font-size:10.5pt;}
    .lede p{margin:0 0 8pt;}
    table.tbl{font-size:8.7pt;}
    table.tbl th{width:auto !important;white-space:normal;}
    table.tbl td,table.tbl th{padding:3.5pt 5pt;line-height:1.32;}
    .priority-badge,.status-pill{padding:1pt 5pt;}

    .usecase-card{border:none;background:none;padding:0;}
    .usecase-head{margin-bottom:6pt;}
    dl.usecase-meta{grid-template-columns:100px 1fr;gap:3pt 8pt;margin:8pt 0 9pt;}
    .usecase-card h5{margin:9pt 0 4pt;}
    .stakeholder-list li,.check-list li{margin-bottom:3pt;}
    .flow-col{padding:5pt 8pt;}
    .flow-col li{margin-bottom:3pt;}
    .exception-list li{padding:4pt 7pt;margin-bottom:3pt;}
    .chip{padding:1pt 6pt;font-size:9pt;}

    .doc-section+.doc-section{border-top:none;margin-top:14pt;padding-top:0;}
    .doc-section.sub{margin-top:11pt;}
    .cover{padding:0;}
    .figure-frame{cursor:default;border-color:#ccc;}
    .doc-figure{margin:8pt 0 4pt;}
    .doc-figure img{max-height:215mm;}
    .entity-note,.entity-grid{display:none;}
    .doc-footer{display:none;}

    /* page starts, matched to the original document's own page boundaries */
    #cover{break-after:page;}
    #toc{break-after:page;}
    #overview{break-before:page;}
    #methodology{break-before:page;}
    #requirements{break-before:page;}
    #events{break-before:page;}
    #usecase-diagrams{break-before:page;}
    #usecase-full{break-before:page;}
    #gap-analysis{break-before:page;}
    #context-diagram{break-before:page;}
    #dfd{break-before:page;}
    #dfd-level1,#dfd-p1,#dfd-p2,#dfd-p3,#dfd-p4,#dfd-p5,#dfd-p6,#dfd-p7,#dfd-p8,#dfd-p9,#dfd-p10{break-before:page;}
    #erd{break-before:page;}

    /* avoid awkward mid-element splits; the use case cards are allowed to flow
       across a page boundary (like the source document does) rather than being
       forced onto a fresh page whenever they don't fully fit what's left of one */
    table.tbl tr,.doc-figure,.entity-card,.authors,.usecase-head,dl.usecase-meta>dt,.stakeholder-list li,.check-list li,.flow-col li,.exception-list li{break-inside:avoid;}
    dl.usecase-meta>dt{break-after:avoid;}
    h1,h2,h3,h4,h5{break-after:avoid;}

      {
        id:"uc-login", table:3, title:"Log In", useCaseName:"Log In",
        scenario:`A Class Representative, Faculty member, Dean, Head Laboratory, or Laboratory Staff needs access to their role-scoped SOMADA account.`,

        briefDescription:`SOMADA is now a five-role authenticated system. Under the current manual process there is no system at all — a requester fills out a paper form and brings it to the laboratory in person. Every role signs in with a dedicated SOMADA account and a system-generated password: a Class Representative's username is their NU Student ID, and every other role's username is their NU Fairview email. The system verifies the credentials, establishes a session scoped to the user's role and, for Head Laboratory and Laboratory Staff, their assigned laboratory, and loads the dashboard for that role. Physics Laboratory Staff and Circuits Laboratory Staff never receive standing access to the other laboratory's data.`,
        actors:"Class Representative, Faculty, Dean, Head Laboratory, Physics Laboratory Staff, Circuits Laboratory Staff", related:"View My Dashboard, View Laboratory Dashboard, Issue Class Representative Account",
        stakeholders:[
          `Class Representative and Faculty: need their own account to submit and track reservations without going to the laboratory in person.`,
          `Dean: needs an account to both submit out-of-schedule requests and approve them.`,
          `Head Laboratory and Laboratory Staff: need access scoped to the laboratory or laboratories they are assigned to.`,
          `NU Fairview: requires every account identity-anchored to a real NU identifier.`,

          `If a Physics or Circuits Laboratory Staff account attempts to reach the other laboratory's screens, the system refuses access.`,
        ],

      {

        scenario:`A requester needs a laboratory room, equipment, or both, for a session.`,
        triggeringEvent:`The requester completes the reservation form and submits it.`,
        briefDescription:`Renamed from "File Laboratory Service Request." The requester selects any resources the session needs from the catalogue, states whether the reservation is on-schedule or out-of-schedule, and submits against the laboratory and slot already chosen. What happens next depends on who is submitting: a Class Representative's reservation always requires a decision under Approve / Reject Reservation — from their assigned Faculty member if one exists for the session, otherwise from the Dean. A Faculty member's on-schedule reservation needs no approval, because Faculty already holds academic authority over their own class; a Faculty out-of-schedule reservation still requires the Dean, whose authority covers facility use outside the regular schedule. The Dean's own out-of-schedule reservation — most often for Defense Lab use — likewise needs no approval, since the Dean already is the authority for that case. In every case, the pattern is the same: the appropriate authority approves, and the step is skipped only when the requester already is that authority.`,

          `System determines whether a decision is required, based on the requester's role and whether an assigned professor exists for the session.`,
          `System stores the reservation as Pending and routes it to the appropriate approver, or forwards it directly for laboratory processing where no approval applies.`,
        ],
        exceptions:[

          `If a requested resource quantity exceeds availability, the system flags it so the requester can adjust it.`,

        postconditions:[`The reservation status is set to Cancelled and the block it held is released back to the laboratory schedule.`],
        flowActor:[`Requester opens the reservation from their dashboard.`,`Requester selects Cancel and confirms.`],
        flowSystem:[`System validates that the reservation belongs to the requester and is still cancellable.`,`System sets the status to Cancelled and releases the held block.`],

          `If the reservation was Approved, the assigned Faculty member or Dean is notified of the cancellation.`,

      {

        scenario:`A requester needs to move a reservation to a different date or time.`,
        triggeringEvent:`The requester selects Reschedule on an existing reservation from their dashboard.`,

        actors:"Class Representative, Faculty", related:"Submit Laboratory Reservation, Cancel Laboratory Reservation, View Schedule & Availability",
        stakeholders:[
          `Class Representative and Faculty: need to move a booking without cancelling and refiling from scratch.`,

        flowActor:[`Requester opens the reservation from their dashboard.`,`Requester selects Reschedule and chooses a new vacant block.`,`Requester confirms the change.`],
        flowSystem:[`System validates the new block against the laboratory schedule.`,`System releases the original block and holds the new one.`,`System resets the status to Pending where a decision applies, and routes it to the original approver.`],
        exceptions:[

          `If the reservation is already Completed or the session date has passed, the system refuses the reschedule.`,

      {
        id:"uc-viewstatus", table:10, title:"View Reservation Status", useCaseName:"View Reservation Status",
        scenario:`A requester wants to know where a specific reservation currently stands.`,

        briefDescription:`Replaces the old public reference-number tracking screen. Because the requester is signed in, the system already knows which reservations are theirs — no reference number is needed. The status shown is Pending, Approved, Rejected, Ongoing, or Completed.`,

      {

    gaps: [
      { id:"01", current:`Inventory is held in the inventory finder worksheet as name, description, existing quantity, unit and type, with no condition field and no record of how much of each item is currently out or committed; edits are typed directly into cells.`, proposed:`Provide an inventory module supporting add, edit and remove, in which each holding is recorded by name with a condition status and quantities tracked as existing, available, in use and reserved.`, impact:`Stock levels become visible at a glance and changes are attributable rather than silently overwritten.` },
      { id:"02", current:`Borrowing is recorded in the Physics and Circuits usage logs by date, subject code, professor, particulars and quantity; no student is named anywhere in the workbook.`, proposed:`Provide a borrowing record capturing student ID numbers and time against the approved request.`, impact:`Accountability attaches to the borrower rather than only to the supervising professor.` },
      { id:"03", current:`Damage and loss are logged by date, professor, item, quantity and unit; the accountable group is traceable only through the signed paper slip for that session.`, proposed:`Record damage and loss directly against the accountable group drawn from the borrowing record.`, impact:`Removes the paper cross-reference step and prevents unattributed losses.` },
      { id:"04", current:`Availability is established by opening the inventory finder and reading a quantity that is updated by hand after each session.`, proposed:`Provide a live availability view showing quantities on hand and expected return times.`, impact:`Availability can be checked without a physical count.` },
      { id:"05", current:`End-of-term figures are computed by formula blocks in the Broken, Loss and Consumed worksheet and exported manually into a presentation.`, proposed:`Generate summaries and transaction logs directly from stored records.`, impact:`Reporting no longer depends on preserving a hand-built formula set.` },
      { id:"06", current:`Clearance is issued on paper, signed by the student, a faculty member and the laboratory head, then forwarded to the registrar.`, proposed:`Provide a digital clearance record raised and tracked by the laboratory head.`, impact:`Removes lost and incomplete clearance records and shortens processing time.` },
      { id:"07", current:`Required equipment is written onto the paper service request form and re-encoded by the laboratory head.`, proposed:`Allow equipment to be selected from the catalogue at the kiosk with live stock indicators.`, impact:`Removes re-encoding and prevents requests for items that are unavailable.` },
      { id:"08", current:`Availability is checked against weekly grids kept per laboratory room; a grid for the Circuits room does not yet exist.`, proposed:`Provide a calendar with per-room conflict detection covering every laboratory room.`, impact:`Conflicts are prevented at filing rather than discovered afterwards.` },
      { id:"09", current:`Approval is a signature on a printed form; the signed copy is stored on the university SharePoint service and reached from the request register through a stored link.`, proposed:`Record approval through a confirmation control in an automated email, requiring no account.`, impact:`Removes physical routing of forms and the dependency on external file storage.` },
      { id:"10", current:`Out-of-schedule use is arranged in person or by email against vacant blocks. The two-day advance requirement is applied by the laboratory head but is not recorded or enforced anywhere in the workbook.`, proposed:`Allow out-of-schedule requests to be filed against vacant blocks with the two-day requirement enforced by the system.`, impact:`Removes on-the-spot requests and makes the advance requirement auditable.` },
      { id:"11", current:`Recurrence is written as free text in the remarks column of the request register, for example EVERY SATURDAY.`, proposed:`Type each request as whole-term or one-time and handle the request lifecycle accordingly.`, impact:`Completion counts are no longer distorted by recurring requests.` },
      { id:"12", current:`The usage logs carry a quantity column and a consumed column with a type marker, but nothing prevents an equipment item from being marked consumed.`, proposed:`Record issued and returned quantities separately and bar equipment from being marked consumed.`, impact:`Consumed counts reflect genuine depletion only, and unreturned equipment is recorded as broken or lost.` },
      { id:"13", current:`The hazardous waste disposal worksheet exists as a prepared template in which no disposal has been recorded.`, proposed:`Provide a disposal log linked to the inventory, recording reason, quantity, unit, date and classification.`, impact:`Withdrawals from the laboratory become traceable and hazardous items become reportable.` },
      { id:"14", current:`Consumable levels are known only from the last manual decrement, so a shortage surfaces when a scheduled session already requires the item.`, proposed:`Forecast consumable demand from historical usage and raise stockout alerts ahead of scheduled sessions.`, impact:`Restocking becomes anticipatory rather than reactive.` },
      { id:"15", current:`Item availability, operating hours and request status are answered by the laboratory head in person or by email during office hours.`, proposed:`Provide a virtual assistant answering from laboratory records to verified users at any hour.`, impact:`Reduces repetitive workload and removes the office-hours constraint on routine inquiries.` },
      { id:"16", current:`Usage figures sit in formula blocks and are interpreted by the laboratory head.`, proposed:`Generate automated insights from the dashboard metrics.`, impact:`Patterns in usage and resourcing surface without manual interpretation.` },
    ],

function StatusPill({ status }) {

/* ----------------------------- sidebar ----------------------------- */
function filterNav(items, q) {
  if (!q) return items;
  const lower = q.toLowerCase();
  const out = [];
  for (const item of items) {
    const selfMatch = item.label.toLowerCase().includes(lower);
    const kids = item.children ? filterNav(item.children, q) : null;
    if (selfMatch || (kids && kids.length)) {
      out.push({ ...item, children: kids && kids.length ? kids : (selfMatch ? item.children : null) });
    }
  }
  return out;
}

function flattenIds(items) {
  let out = [];
  for (const it of items) { out.push(it.id); if (it.children) out = out.concat(flattenIds(it.children)); }
  return out;
}

function buildParentMap(items, parent, map) {
  for (const it of items) { map[it.id] = parent; if (it.children) buildParentMap(it.children, it.id, map); }
  return map;
}

function NavTree({ items, activeId, expanded, toggleExpand, onNavigate, depth, forceOpen }) {

                onNavigate={onNavigate} depth={depth + 1} forceOpen={forceOpen} />
            )}
          </li>
        );
      })}
    </ul>
  );
}

function OverviewSection() {
  return (
    <section id="overview" className="doc-section">
      <SectionHeading title="I. Project Overview" id="overview" />
      <div className="lede">
        <p>SOMADA is a web-based laboratory management system for the Physics and Circuits Laboratory of NU Fairview. It replaces the laboratory's paper forms and spreadsheet records with one online system that holds the inventory, room bookings, borrowing records, clearances and disposal records together and keeps them consistent.</p>
        <p>The laboratory is a teaching facility on the fourth floor of the campus, open from 8:30 AM to 5:30 PM, serving the laboratory sessions of physics, circuits and information technology subjects. It holds 322 catalogued items in eight categories. Some are durable equipment such as oscilloscopes, multimeters, Arduino kits and physics apparatus. The rest are consumable supplies such as resistors, jumper wires, soldering lead and batteries. One person, the laboratory head, manages all of it.</p>
        <p>Every transaction currently begins on paper. Students and faculty fill out borrower's slips and laboratory service request forms by hand. The laboratory head reviews each one, then types the same information again into a protected Google Sheets workbook of eleven worksheets. Room availability is checked against a separate weekly grid for each room, and on those grids the difference between a class session, a lecture booking and a special request exists only as the laboratory head's own colour coding. Approvals are signatures collected in person, and the signed forms are kept outside the workbook.</p>
        <p>None of these records are connected to each other, and that is where the difficulty starts. The borrowing records are not linked to the inventory, so one mistyped quantity quietly changes every figure that depends on it, and nobody can tell how much of a consumable is left without counting it by hand. Approvals are slow because a form has to be carried to a person for signature. Scheduling conflicts turn up only after they have happened. A shortage of supplies is discovered at the moment a scheduled session needs the item. Students and faculty who want to know whether an item is available, or whether their request has been approved, have to visit the laboratory or wait for the laboratory head to reply. When an instrument comes back damaged, or does not come back at all, the only way to find out who is accountable is to dig up the signed paper slip from that session.</p>
        <p>The proposed system puts all of this on one platform, built around five authenticated roles in place of the single administrative account the laboratory head previously held alone: Class Representative, Faculty, Dean, Head Laboratory, and Laboratory Staff assigned to either the Physics or the Circuits Laboratory. Every role signs in to its own SOMADA account — a Class Representative by NU Student ID, everyone else by NU Fairview email, each with a system-generated password — in place of a paper form filled out and brought to the laboratory in person. A Class Representative's account is issued top-down: Head Laboratory creates it and the system emails the credentials to the class's assigned Faculty member, who hands them to the representative in person. After choosing Physics or Circuits Laboratory and checking its schedule, a requester submits a reservation on-schedule or out-of-schedule, selecting any resources the session needs from a catalogue with live stock; a one-time reservation holds a single time block, while a whole-term reservation holds the corresponding block in each remaining week of the term, and the system checks every block it would hold for conflicts before accepting it. Whether that reservation needs a decision, and from whom, follows one rule throughout: the appropriate authority approves, and the step is skipped only when the requester already is that authority. A Class Representative's reservation is decided by their assigned Faculty member, or by the Dean where no professor is assigned; a Faculty member's own on-schedule reservation needs no approval, since Faculty already holds authority over their class, while a Faculty out-of-schedule reservation still goes to the Dean; and the Dean's own out-of-schedule reservation — most often for Defense Lab use — likewise needs none, since the Dean already is the authority for that case. From an approved reservation, Head Laboratory or the assigned Laboratory Staff issue the equipment, and the system builds the borrowing record, deducts the stock, and reconciles the returns after the session, raising a clearance against the accountable Class Representative or Faculty member where an item comes back broken or does not come back at all — a clearance the accountable party can now see directly from their own dashboard, rather than only on a paper copy. Items withdrawn from the laboratory for good go into a disposal log. Artificial intelligence is scoped to one function: Ask Laboratory Question, an assistant reachable only from inside a signed-in Class Representative or Faculty account, answering on item availability, schedule availability, operating hours, and the status of the requester's own reservation, grounded in the laboratory's own records and never creating or deciding a reservation itself; the demand-forecasting and automated dashboard-insight functions considered earlier are cut from scope. Each requester follows their own reservations from My Dashboard rather than a public reference-number screen, and can cancel or reschedule a reservation without refiling it from scratch. At the end of the term Head Laboratory exports the report of laboratory activity, compiled across both laboratories, and submits it to the administration. Payment for lost items, outside repairs, and the hand-off to the registrar stay manual.</p>
      </div>
    </section>
  );
}

function MethodologySection({ onZoom }) {
  return (
    <section id="methodology" className="doc-section">
      <SectionHeading title="II. Methodology" id="methodology" />
      <div className="lede">
        <p>The system is developed under the Agile methodology, following the Scrum Framework. Agile was selected because the requirements of this project continued to change throughout requirements gathering.</p>
        <p>This project spans three (3) terms, each term running thirteen and a half (13.5) weeks and corresponding to one subject and one release: MNTSDEV in the second year third term, MYSADD1 in the third year first term, and MCSPROJ in the third year second term.</p>
      </div>
      <Figure src="assets/figures/fig-scrum.png" caption="Figure 1: Scrum Framework" onZoom={onZoom} />
      <div className="lede" style={{marginTop:18}}>
        <p><strong>Product Vision.</strong> The product vision was formed during MNTSDEV from the operational problems of the Physics and Circuits Laboratory and the Product Owner: paper borrower's slips and laboratory service request forms re-encoded by hand, a Google Sheet and several workbooks whose borrowing records are not linked to its inventory, room availability checked against a separate weekly grid for each room, approvals signed on paper and stored outside the workbook, and consumable quantities that cannot be established without a physical count.</p>
        <p><strong>Product Backlog and User Stories.</strong> From that vision the team wrote the objectives as user stories and organized them into the product backlog presented in Table 1: to digitalize inventory and equipment borrowing, to provide reservation with conflict detection, to replace paper-based clearance, to record approval through an emailed confirmation control and publish request status, to add demand forecasting and a virtual assistant, and to record waste disposal. The backlog is a living artifact and is refined continuously as consultation produces new information.</p>
        <p><strong>Sprint Planning.</strong> At the start of each sprint, the team will pull the backlog items it forecasts it can complete into sprint backlogs, and state a sprint goal. However, it may be adjusted if there is new information or miscalculations.</p>
        <p><strong>The Sprint.</strong> Sprints will run at a fixed length. However, the fixed length will be decided when the development phase starts.</p>
        <p><strong>Sprint Review and Sprint Retrospective.</strong> Each sprint closes with a sprint review, at which is demonstrated to the laboratory head and the backlog is adjusted in light of what he raises, and then a sprint retrospective, at which the team inspects how it worked during the sprint, its collaboration, its tools and its process, and commits to at least one improvement for the next sprint. The review inspects the product, while the retrospective inspects the process.</p>
        <p><strong>Product Backlog Refinement.</strong> Findings from the review and the retrospective return to the product backlog, which the Product Owner reorders before the next sprint planning.</p>
        <p><strong>Current Status.</strong> As of this submission the product vision, the product backlog, the requirements analysis, the system models and the prototype are complete or in revision, and construction has not begun. Every item in Table 1 therefore carries the status Not Started, and the fixed length of the sprint is left unassigned until the development phase starts.</p>
      </div>
    </section>
  );
}

/* ----------------------------- app shell ----------------------------- */
function App() {
  const flatIds = useMemo(() => flattenIds(NAV), []);
  const parentMap = useMemo(() => buildParentMap(NAV, null, {}), []);

  const [activeId, setActiveId] = useState(flatIds[0]);
  const [query, setQuery] = useState("");
  const [expanded, setExpanded] = useState({ requirements: true });
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [progress, setProgress] = useState(0);
  const [showTop, setShowTop] = useState(false);
  const searchRef = useRef(null);
  const tickingRef = useRef(false);

  const toggleExpand = useCallback((id) => {
    setExpanded(prev => ({ ...prev, [id]: !prev[id] }));
  }, []);

  const scrollToSection = useCallback((id) => {
    const el = document.getElementById(id);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      history.replaceState(null, "", "#" + id);
      setActiveId(id);
    }
    setSidebarOpen(false);
  }, []);

  // auto-expand ancestors of the active section
  useEffect(() => {
    let id = parentMap[activeId];
    const toOpen = {};
    while (id) { toOpen[id] = true; id = parentMap[id]; }
    if (Object.keys(toOpen).length) setExpanded(prev => ({ ...prev, ...toOpen }));
  }, [activeId, parentMap]);

  // scrollspy + reading progress, rAF-throttled
  useEffect(() => {
    const els = flatIds.map(id => document.getElementById(id)).filter(Boolean);
    function update() {
      const scrollTop = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(max > 0 ? Math.min(100, (scrollTop / max) * 100) : 0);
      setShowTop(scrollTop > 800);

      const threshold = window.innerHeight * 0.28;
      let current = els[0] && els[0].id;
      for (const el of els) {
        if (el.getBoundingClientRect().top - threshold <= 0) current = el.id; else break;
      }
      setActiveId(prev => (prev === current ? prev : current));
      tickingRef.current = false;
    }
    function onScroll() {
      if (!tickingRef.current) { tickingRef.current = true; window.requestAnimationFrame(update); }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    update();
    return () => window.removeEventListener("scroll", onScroll);
  }, [flatIds]);

  // open a direct link's hash on first load
  useEffect(() => {
    if (location.hash) {
      const id = location.hash.slice(1);
      setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ block: "start" }); }, 60);
    }
  }, []);

  // "/" focuses search, unless already typing somewhere
  useEffect(() => {
    function onKey(e) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
        searchRef.current && searchRef.current.focus();
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <React.Fragment>
      <div className="progress-bar" style={{ width: progress + "%" }}></div>
      <div className="topbar">
        <div className="topbar-left">
          <button className="icon-btn menu-toggle" onClick={() => setSidebarOpen(o => !o)} aria-label="Toggle outline"><IconMenu /></button>
          <div className="brand">
            <div className="brand-badge">🧪</div>
            <div className="brand-text">
              <span className="brand-title">SOMADA Documentation</span>
              <span className="brand-sub">Web-Based Laboratory Management System · MSYADD1</span>
            </div>
          </div>
        </div>
        <div className="topbar-right">
          <button className="icon-btn" onClick={() => window.print()}><IconPrint /> <span>Print / Export PDF</span></button>
        </div>
      </div>

      <nav className="page-tabs">
        <a className="page-tab" href="index.html">🏠 Home</a>
        <a className="page-tab active" href="Docs.html">📄 Documentation</a>
        <a className="page-tab" href="Current-System.html">🗂️ Current System</a>
        <a className="page-tab" href="assets/figures-v2/usecase-diagram-source.html">🧩 Use Case Diagram</a>
        <a className="page-tab" href="assets/figures-v2/dfd-level0/dfd-level0-source.html">🔀 DFD Level 0</a>
        <a className="page-tab" href="assets/figures-v2/dfd-level1/dfd-level1-source.html">🔀 DFD Level 1</a>
      </nav>

      <div className="shell">
        {sidebarOpen && <div className="sidebar-scrim show" onClick={() => setSidebarOpen(false)}></div>}
        <Sidebar activeId={activeId} onNavigate={scrollToSection} open={sidebarOpen} query={query} setQuery={setQuery}
          expanded={expanded} toggleExpand={toggleExpand} searchRef={searchRef} />

        <main className="content-wrap" role="main">
          <div className="paper">
            <CoverSection />
            <TocSection onNavigate={scrollToSection} />
            <OverviewSection />
            <MethodologySection onZoom={setLightbox} />
            <RequirementsIntro />
            <BacklogSection />
            <EventsSection />
            <UseCaseDiagramsSection onZoom={setLightbox} />
            <UseCaseFullSection />
            <GapAnalysisSection />
            <ContextDiagramSection onZoom={setLightbox} />
            <DfdSection onZoom={setLightbox} />
            <ErdSection onZoom={setLightbox} />
            <Footer />
          </div>
        </main>
      </div>

      <button className={`back-to-top ${showTop ? "show" : ""}`} onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} aria-label="Back to top">
        <IconUp />
      </button>

      {lightbox && <Lightbox src={lightbox.src} caption={lightbox.caption} onClose={() => setLightbox(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script>
  // Explicit transform (rather than Babel's auto data-presets scan) so this
  // works the same regardless of Babel-standalone version quirks.
  var appCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(appCode, { presets: ["react"] }).code;
  var runner = document.createElement("script");
  runner.textContent = compiled;
  document.body.appendChild(runner);
</script>
</body>
