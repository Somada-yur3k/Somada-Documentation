<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Web-Based Physics and Circuits Laboratory Management System with AI Capabilities for NU Fairview</title>
<meta name="description" content="A Web-Based Physics and Circuits Laboratory Management System with AI Capabilities for NU Fairview — project documentation (MSYADD1)." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f4; --paper:#ffffff; --ink:#1f2430; --ink-soft:#5b6270; --ink-faint:#8a90a0;
    --line:#e3e6ec; --line-strong:#cfd4dd;
    --accent:#5b47e0; --accent-ink:#4433b8; --accent-soft:#efecfd;
    --sidebar-bg:#fbfbfd; --head-bg:#f6f6fa;
    --must-bg:#fdecea; --must-ink:#b3261e;
    --should-bg:#e8f0fe; --should-ink:#1a56c4;
    --st-neutral-bg:#eef0f4; --st-neutral-ink:#5b6270;
    --st-progress-bg:#fff4e0; --st-progress-ink:#a15c00;
    --st-done-bg:#e6f6ec; --st-done-ink:#1a7d3f;
    --st-blocked-bg:#fdecea; --st-blocked-ink:#b3261e;
    --shadow:0 1px 2px rgba(20,20,43,.05), 0 10px 30px rgba(20,20,43,.07);
    --radius:12px;
    --chrome-h:99px;
  }
  *{box-sizing:border-box;}
  html{height:100%;scroll-behavior:smooth;overflow:hidden;}
  body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
  #root{height:100%;}
  h1,h2,h3,h4{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;color:var(--ink);line-height:1.25;margin:0;}
  p{margin:0 0 12px;}
  ul,ol{margin:0 0 12px;padding-left:22px;}
  li{margin-bottom:6px;}
  a{color:var(--accent-ink);}
  button{font-family:inherit;}
  ::selection{background:#d7cdfb;}

  /* ---------- chrome: progress + topbar ---------- */
  .progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#8f7bff);width:0%;z-index:70;transition:width .1s linear;}
  .topbar{position:fixed;top:3px;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:60;gap:12px;}
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .page-tabs{position:fixed;top:59px;left:0;right:0;height:40px;background:#fbfbfd;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 16px;z-index:59;overflow-x:auto;}
  .page-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex:0 0 auto;}
  .page-tab:hover{background:#eef0f4;color:var(--ink);}
  .page-tab.active{background:var(--accent-soft);color:var(--accent-ink);}
  .topbar-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .doc-zoom-controls{height:36px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;}
  .doc-zoom-controls button{height:100%;border:0;background:#fff;color:var(--ink-soft);cursor:pointer;font-size:16px;font-weight:700;padding:0 10px;line-height:1;}
  .doc-zoom-controls button:hover{background:var(--head-bg);color:var(--ink);}
  .doc-zoom-controls button:disabled{color:#b7bfcb;cursor:not-allowed;background:#fff;}
  .doc-zoom-controls .zoom-readout{min-width:54px;border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.01em;}
  a.icon-btn{text-decoration:none;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .brand-badge{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-title{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;}
  .brand-sub{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;height:36px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:600;}
  .icon-btn:hover{background:var(--head-bg);color:var(--ink);}
  .icon-btn svg{width:16px;height:16px;}
  .menu-toggle{display:none;width:36px;padding:0;}
  .menu-toggle svg{width:18px;height:18px;}

  /* ---------- layout shell ---------- */
  .shell{display:flex;}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(20,20,43,.35);z-index:45;}
  .sidebar{position:fixed;top:var(--chrome-h);left:0;bottom:0;width:300px;background:var(--sidebar-bg);border-right:1px solid var(--line);overflow:hidden;z-index:50;padding:14px 10px 40px;}
  .sidebar-search{position:relative;margin:2px 4px 12px;}
  .sidebar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);}
  .sidebar-search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:#fff;padding:0 10px 0 32px;font-size:13px;color:var(--ink);outline:none;}
  .sidebar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sidebar-search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;background:#f8f8fb;}
  .doc-chip{display:flex;align-items:center;gap:8px;margin:0 4px 10px;padding:8px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .doc-chip span.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .nav-empty{padding:14px 10px;font-size:12.5px;color:var(--ink-faint);}

  .nav-list{list-style:none;margin:0;padding:0;}
  .nav-row{display:flex;align-items:stretch;border-left:3px solid transparent;border-radius:0 8px 8px 0;margin:1px 0;}
  .nav-row.active{border-left-color:var(--accent);background:var(--accent-soft);}
  .nav-row.active>.nav-label .nav-text{color:var(--accent-ink);font-weight:700;}
  .nav-label{flex:1;display:flex;align-items:center;gap:7px;min-width:0;background:none;border:none;text-align:left;padding:7px 8px;font-size:13px;color:var(--ink-soft);cursor:pointer;border-radius:8px;}
  .nav-label:hover{background:#f0f0f7;color:var(--ink);}
  .nav-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-page{margin-left:auto;font-size:10.5px;color:var(--ink-faint);flex:0 0 auto;padding-left:6px;}
  .nav-chevron{width:26px;flex:0 0 auto;background:none;border:none;color:var(--ink-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;}
  .nav-chevron:hover{background:#e9e9f2;color:var(--ink);}
  .nav-chevron svg{width:13px;height:13px;transition:transform .15s ease;}
  .nav-chevron.open svg{transform:rotate(90deg);}

  .content-wrap{flex:1;margin-left:300px;margin-top:var(--chrome-h);min-width:0;padding:32px 20px 120px;}
  .paper{max-width:860px;margin:0 auto;background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:56px 64px;}
  .doc-section{scroll-margin-top:75px;padding-top:6px;}
  .doc-section + .doc-section{margin-top:46px;padding-top:32px;border-top:1px solid var(--line);}
  .doc-section.sub{margin-top:34px;padding-top:0;border-top:none;}

  /* ---------- headings ---------- */
  .section-heading{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .section-heading h2{font-size:26px;}
  .section-heading h3{font-size:20px;}
  .section-heading h4{font-size:16.5px;}
  .kicker{font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:.03em;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;vertical-align:middle;margin-right:8px;}
  .anchor-link{opacity:0;text-decoration:none;color:var(--ink-faint);font-family:'Inter',sans-serif;font-weight:400;font-size:14px;transition:opacity .1s;}
  .section-heading:hover .anchor-link{opacity:1;}
  .cap{font-family:'Source Serif 4',serif;font-style:italic;color:var(--ink-soft);font-size:14px;margin:-4px 0 16px;}
  .lede{font-family:'Source Serif 4',serif;font-size:16px;line-height:1.7;color:var(--ink);}
  .lede p{margin:0 0 15px;}

  /* ---------- cover ---------- */
  .cover{text-align:center;padding:30px 0 10px;}
  .cover .kicker-line{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-family:'Inter',sans-serif;font-weight:600;margin-bottom:22px;}
  .cover h1{font-size:30px;line-height:1.35;margin-bottom:30px;}
  .cover .meta-block{font-family:'Source Serif 4',serif;font-size:15px;color:var(--ink-soft);line-height:2;margin:26px 0;}
  .cover .meta-block strong{color:var(--ink);}
  .authors{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;max-width:520px;margin:26px auto 0;font-family:'Source Serif 4',serif;font-size:15.5px;}
  .authors div{padding:4px 0;}

  /* ---------- TOC ---------- */
  .toc-list{list-style:none;margin:0;padding:0;font-family:'Source Serif 4',serif;font-size:15.5px;}
  .toc-list li{margin-bottom:2px;}
  .toc-row{display:flex;align-items:baseline;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer;text-decoration:none;color:var(--ink);}
  .toc-row:hover{background:var(--head-bg);}
  .toc-row.indent{padding-left:26px;font-size:14.5px;color:var(--ink-soft);}
  .toc-label{white-space:nowrap;}
  .toc-fill{flex:1;border-bottom:1.5px dotted var(--line-strong);position:relative;top:-4px;margin:0 4px;}
  .toc-page{color:var(--ink-faint);font-size:13.5px;font-family:'Inter',sans-serif;}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0 6px;}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.3px;font-family:'Inter',sans-serif;min-width:640px;}
  table.tbl th{background:var(--head-bg);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line-strong);font-weight:700;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink);}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tr:hover td{background:#fbfbfe;}

  .priority-badge,.status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .priority-must{background:var(--must-bg);color:var(--must-ink);}
  .priority-should{background:var(--should-bg);color:var(--should-ink);}
  .status-neutral{background:var(--st-neutral-bg);color:var(--st-neutral-ink);}
  .status-progress{background:var(--st-progress-bg);color:var(--st-progress-ink);}
  .status-done{background:var(--st-done-bg);color:var(--st-done-ink);}
  .status-blocked{background:var(--st-blocked-bg);color:var(--st-blocked-ink);}

  /* ---------- figures ---------- */
  .doc-figure{margin:18px 0 8px;text-align:center;}
  .figure-frame{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfbfd;cursor:zoom-in;}
  .figure-frame img{display:block;max-width:100%;height:auto;max-height:560px;object-fit:contain;margin:0 auto;}
  .zoom-hint{position:absolute;right:8px;bottom:8px;background:rgba(31,36,48,.78);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .12s;}
  .zoom-hint svg{width:11px;height:11px;}
  .figure-frame:hover .zoom-hint{opacity:1;}
  .figure-editor-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 11px;border:1px solid #cbd8f1;border-radius:8px;background:#f3f7ff;color:#2455b8;font-size:12px;font-weight:700;text-decoration:none;}
  .figure-editor-link:hover{background:#e8f0ff;border-color:#9db8ea;}
  .diagram-embed{display:block;width:100%;aspect-ratio:4500/4100;border:0;background:#fff;}
  figcaption{font-family:'Source Serif 4',serif;font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-top:10px;}

  /* ---------- use case cards ---------- */
  .usecase-card{background:#fcfcfe;border:1px solid var(--line);border-radius:12px;padding:26px 28px;}
  .usecase-head{margin-bottom:14px;}
  .usecase-table-tag{display:inline-block;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-bottom:6px;}
  .usecase-head h4{font-size:19px;}
  .usecase-subtitle{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink-faint);margin-top:3px;}
  dl.usecase-meta{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;margin:16px 0 20px;font-size:14px;}
  dl.usecase-meta dt{font-family:'Inter',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);padding-top:2px;}
  dl.usecase-meta dd{margin:0;font-family:'Source Serif 4',serif;line-height:1.6;color:var(--ink);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:'Inter',sans-serif;font-size:12px;background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .usecase-card h5{font-family:'Inter',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;margin:20px 0 8px;}
  .stakeholder-list,.check-list{list-style:none;padding:0;margin:0 0 4px;font-size:14px;}
  .stakeholder-list li,.check-list li{position:relative;padding-left:18px;margin-bottom:8px;font-family:'Source Serif 4',serif;line-height:1.55;}
  .stakeholder-list li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .check-list li::before{content:"✓";position:absolute;left:0;top:0;color:var(--st-done-ink);font-weight:700;font-family:'Inter',sans-serif;font-size:12.5px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
  .flow-table{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .flow-col{padding:14px 18px;}
  .flow-col:first-child{border-right:1px solid var(--line);}
  .flow-col-head{font-family:'Inter',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent-ink);margin-bottom:8px;}
  .flow-col ol{margin:0;padding-left:18px;font-family:'Source Serif 4',serif;font-size:13.8px;line-height:1.55;}
  .flow-col li{margin-bottom:9px;}
  .exception-list{list-style:none;padding:0;margin:0;}
  .exception-list li{font-family:'Source Serif 4',serif;font-size:14px;line-height:1.6;background:#fff8ec;border-left:3px solid #e8ac2e;padding:9px 14px;border-radius:0 8px 8px 0;margin-bottom:8px;}

  /* ---------- entities reference (ERD) ---------- */
  .entity-note{font-size:12.5px;color:var(--ink-faint);font-family:'Inter',sans-serif;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .entity-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .entity-card{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fcfcfe;}
  .entity-card .ename{font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;color:var(--accent-ink);margin-bottom:4px;letter-spacing:.02em;}
  .entity-card .efields{font-size:12px;color:var(--ink-soft);line-height:1.5;font-family:'Inter',sans-serif;}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(15,16,24,.86);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;background:#fff;}
  .lightbox-caption{color:#e7e7ee;font-family:'Source Serif 4',serif;font-style:italic;margin-top:16px;font-size:14px;text-align:center;max-width:700px;}
  .lightbox-close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-close svg{width:18px;height:18px;}

  /* ---------- footer / back-to-top ---------- */
  .doc-footer{margin-top:50px;padding-top:22px;border-top:1px solid var(--line);font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-faint);line-height:1.7;}
  .back-to-top{position:fixed;right:26px;bottom:26px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line-strong);box-shadow:var(--shadow);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;}
  .back-to-top.show{opacity:1;pointer-events:auto;}
  .back-to-top:hover{color:var(--accent-ink);transform:translateY(-2px);}
  .back-to-top svg{width:18px;height:18px;}

  /* ---------- responsive ---------- */
  @media (max-width:980px){
    .menu-toggle{display:inline-flex;}
    .sidebar{left:-320px;transition:left .22s ease;box-shadow:0 0 40px rgba(0,0,0,.15);}
    .sidebar.open{left:0;}
    .sidebar-scrim.show{display:block;}
    .content-wrap{margin-left:0;padding:24px 14px 100px;}
    .paper{padding:34px 22px;}
    .brand-sub{display:none;}
    .topbar-right .icon-btn span{display:none;}
    .topbar-right .icon-btn{width:36px;padding:0;justify-content:center;}
    dl.usecase-meta{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
    .flow-table{grid-template-columns:1fr;}
    .flow-col:first-child{border-right:none;border-bottom:1px solid var(--line);}
    .entity-grid{grid-template-columns:1fr;}
    .authors{grid-template-columns:1fr;text-align:center;}
  }


  /* ---------- refreshed professional interface ---------- */
  :root{
    --bg:#f3f6fb;
    --paper:#ffffff;
    --ink:#172033;
    --ink-soft:#526078;
    --ink-faint:#8a95a8;
    --line:#e5eaf2;
    --line-strong:#d5ddea;
    --accent:#2563eb;
    --accent-ink:#1d4ed8;
    --accent-soft:#eaf1ff;
    --sidebar-bg:#fbfcfe;
    --head-bg:#f7f9fc;
    --shadow:0 1px 3px rgba(27,39,64,.06),0 18px 45px rgba(43,60,89,.08);
    --radius:16px;
    --chrome-h:111px;
  }
  body{background:linear-gradient(135deg,#f7f9fd 0%,#eef3fa 100%);letter-spacing:-.006em;}
  a{color:var(--accent-ink);}
  .progress-bar{height:4px;background:linear-gradient(90deg,#2563eb,#14b8a6);}
  .topbar{height:64px;padding:0 24px;background:rgba(255,255,255,.92);border-bottom-color:rgba(213,221,234,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .page-tabs{top:67px;height:44px;padding:0 24px;background:rgba(251,252,254,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .brand-badge{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#0f4bc5);box-shadow:0 6px 14px rgba(37,99,235,.24);font-size:17px;}
  .brand-title{font-size:14px;letter-spacing:-.02em;}
  .brand-sub{font-size:11px;letter-spacing:0;}
  .page-tab{padding:7px 11px;border-radius:7px;font-size:12px;transition:background .15s,color .15s;}
  .page-tab.active{background:#e8efff;color:#1d4ed8;}
  .icon-btn{height:37px;border-color:#d9e1ed;border-radius:9px;box-shadow:0 1px 1px rgba(27,39,64,.03);transition:background .15s,border-color .15s,transform .15s;}
  .icon-btn:hover{background:#f7f9fc;border-color:#bbc9dc;transform:translateY(-1px);}
  .sidebar{top:var(--chrome-h);width:290px;overflow:hidden;padding:18px 14px 44px;background:rgba(251,252,254,.88);border-right-color:#e2e8f0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}

      { id:"05", current:`End-of-term figures are calculated using formula blocks in the Broken, Loss and Consumed worksheet and manually transferred to a presentation.`, proposed:`Generate summaries and transaction logs directly from stored records.`, impact:`Reporting no longer relies on maintaining a manually prepared set of spreadsheet formulas.` },
      { id:"06", current:`Clearance is issued on paper, signed by the student, a Faculty member and Head Laboratory, and forwarded to the registrar.`, proposed:`Provide a digital clearance record created and tracked by Head Laboratory.`, impact:`Digital tracking helps prevent lost or incomplete clearance records and reduce processing time.` },
      { id:"07", current:`Required equipment is listed on the paper service request form and entered again by Head Laboratory.`, proposed:`Allow users to select equipment from the online catalogue using live stock indicators.`, impact:`Equipment selection removes repeated encoding and helps prevent requests for unavailable items.` },

      { id:"09", current:`Approval is recorded as a signature on a printed form. The signed copy is stored on the university SharePoint service and accessed through a link in the request register.`, proposed:`Record approval or rejection through the assigned Faculty or Dean account, retaining the decision, approver and time.`, impact:`Approval no longer requires physical routing of forms or external storage of signed copies.` },

<script type="text/plain" id="app-source">

/* ----------------------------- small pieces ----------------------------- */
function PriorityBadge({ priority }) {
  const p = (priority || "").toLowerCase();
  const cls = p === "must" ? "priority-must" : p === "should" ? "priority-should" : "priority-should";
  return <span className={`priority-badge ${cls}`}>{priority}</span>;
}

function StatusPill({ status }) {
  const s = (status || "").toLowerCase();
  let cls = "status-neutral";
  if (s.includes("progress")) cls = "status-progress";
  else if (s.includes("block")) cls = "status-blocked";
  else if (s.includes("done") || s.includes("complete")) cls = "status-done";
  else if (s.includes("not started")) cls = "status-neutral";
  return <span className={`status-pill ${cls}`}>{status}</span>;
}

function SectionHeading({ level = 2, kicker, title, id }) {
  const Tag = "h" + level;
  return (
    <div className="section-heading">
      <Tag>
        {kicker && <span className="kicker">{kicker}</span>}
        {title}
      </Tag>
      <a className="anchor-link" href={`#${id}`}>#</a>
    </div>
  );
}

function DataTable({ columns, rows }) {
  return (
    <div className="table-wrap">
      <table className="tbl">
        <thead><tr>{columns.map(c => <th key={c.key} style={c.width ? { width: c.width } : undefined}>{c.label}</th>)}</tr></thead>
        <tbody>
          {rows.map((row, i) => (
            <tr key={i}>{columns.map(c => <td key={c.key}>{c.render ? c.render(row[c.key], row) : row[c.key]}</td>)}</tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}


function Figure({ src, caption, onZoom, editorHref }) {

    <figure className="doc-figure">
      <div className="figure-frame" onClick={() => onZoom({ src, caption })}>
        <img src={src} alt={caption} loading="lazy" />
        <span className="zoom-hint"><IconZoom /> Click to enlarge</span>
      </div>
      <figcaption>{caption}</figcaption>
      {editorHref && <a className="figure-editor-link" href={editorHref}>Open interactive arrow editor</a>}
    </figure>
  );
}

function Lightbox({ src, caption, onClose }) {
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="lightbox" onClick={onClose}>
      <button className="lightbox-close" onClick={onClose} aria-label="Close"><IconClose /></button>
      <img src={src} alt={caption} onClick={(e) => e.stopPropagation()} />
      <div className="lightbox-caption">{caption}</div>
    </div>
  );
}

/* ----------------------------- sidebar ----------------------------- */
function filterNav(items, q) {
  if (!q) return items;
  const lower = q.toLowerCase();
  const out = [];
  for (const item of items) {
    const selfMatch = item.label.toLowerCase().includes(lower);
    const kids = item.children ? filterNav(item.children, q) : null;
    if (selfMatch || (kids && kids.length)) {
      out.push({ ...item, children: kids && kids.length ? kids : (selfMatch ? item.children : null) });
    }
  }
  return out;
}

function flattenIds(items) {
  let out = [];
  for (const it of items) { out.push(it.id); if (it.children) out = out.concat(flattenIds(it.children)); }
  return out;
}

function buildParentMap(items, parent, map) {
  for (const it of items) { map[it.id] = parent; if (it.children) buildParentMap(it.children, it.id, map); }
  return map;
}

function NavTree({ items, activeId, expanded, toggleExpand, onNavigate, depth, forceOpen }) {
  return (
    <ul className="nav-list">
      {items.map(item => {
        const hasChildren = !!(item.children && item.children.length);
        const isActive = item.id === activeId;
        const isOpen = forceOpen || !!expanded[item.id];
        return (
          <li key={item.id}>
            <div className={`nav-row ${isActive ? "active" : ""}`}>
              <button className="nav-label" style={{ paddingLeft: 8 + depth * 16 }} onClick={() => onNavigate(item.id)}>
                <span className="nav-text">{item.label}</span>
              </button>
              {hasChildren && (
                <button className={`nav-chevron ${isOpen ? "open" : ""}`} aria-label="Toggle section"
                  onClick={(e) => { e.stopPropagation(); toggleExpand(item.id); }}>
                  <IconChevron />
                </button>
              )}
            </div>
            {hasChildren && isOpen && (
              <NavTree items={item.children} activeId={activeId} expanded={expanded} toggleExpand={toggleExpand}
                onNavigate={onNavigate} depth={depth + 1} forceOpen={forceOpen} />
            )}
          </li>
        );
      })}
    </ul>
  );
}

function Sidebar({ activeId, onNavigate, open, query, setQuery, expanded, toggleExpand, searchRef }) {
  const visible = useMemo(() => filterNav(NAV, query.trim()), [query]);
  return (
    <aside className={`sidebar ${open ? "open" : ""}`} aria-label="Document outline">

          onChange={(e) => setQuery(e.target.value)} />

      </div>
      {visible.length === 0
        ? <div className="nav-empty">No sections match "{query}".</div>
        : <NavTree items={visible} activeId={activeId} expanded={expanded} toggleExpand={toggleExpand}
            onNavigate={onNavigate} depth={0} forceOpen={!!query.trim()} />

}

function OverviewSection() {
  return (
    <section id="overview" className="doc-section">
      <SectionHeading title="I. Project Context" id="overview" />
      <div className="lede">
        <p>The Physics and Circuits laboratories of NU Fairview provide rooms, equipment and consumable supplies for laboratory activities. Head Laboratory maintains handwritten forms and separate spreadsheets for requests, inventory, borrowing, returns and student clearance. Repeated encoding and manual cross-checking make it difficult to confirm availability, identify schedule conflicts, trace damaged or missing equipment and provide timely updates.</p>
        <p>The proposed Web-Based Physics and Circuits Laboratory Management System with AI Capabilities for NU Fairview brings these records and processes together, with access based on user responsibilities. It covers reservations and approvals, inventory, borrowing and returns, clearance, daily tasks, disposal and end-term reporting. A chatbot answers laboratory questions, while inventory forecasts help Head Laboratory review future stock needs. The project aims to reduce repeated encoding, keep records consistent and help identify responsibility for laboratory items.</p>
        <h3 id="problem">1.1 Statement of the Problem</h3>
        <p>Maintaining separate paper and spreadsheet records can delay availability checks, request approvals and the tracing of damaged or unreturned equipment. It also complicates usage reporting and inventory planning. The study addresses the following questions:</p>
        <ol type="1" start={1} className="academic-numbered-list">
          <li>How can linked inventory, reservation and borrowing records reduce repeated encoding and make transaction history easier to track?</li>
          <li>How can role-based scheduling and approval processes provide authorized requesters with clear information on laboratory availability and reservation status?</li>
          <li>How can Head Laboratory identify students accountable for damaged or unreturned equipment and manage their clearance after return processing?</li>
          <li>How can approved laboratory information and previous usage records help answer routine questions and plan inventory needs without allowing AI to change transactions?</li>
        </ol>
        <h3 id="objectives">1.2 Objectives</h3>
        <h4>1.2.1 Main Objective</h4>
        <p>To design and develop a web-based Physics and Circuits Laboratory Management System that brings together controlled user access, reservations and approvals, inventory and borrowing, student clearance, laboratory records and reporting, with Q&amp;A for laboratory information and inventory forecasts for review.</p>
        <h4>1.2.2 Specific Objectives</h4>
        <ol type="1" start={1} className="academic-numbered-list">
          <li>Provide accounts with role-based access and allow Head Laboratory to create and manage Faculty and Class Representative accounts using verified details.</li>
          <li>Provide schedule and item availability checks, Group or Student Only reservations through a Class Representative account, and approval through Faculty or Dean accounts according to schedule type and Faculty availability.</li>
          <li>Link inventory, approved borrowing slips, issuance and return outcomes to retain borrower identities and records of actual consumable use.</li>
          <li>Allow Head Laboratory to identify accountable students and create, update and resolve clearance records, with each student's status visible to the relevant Class Representative.</li>
          <li>Compile completed laboratory usage into Average Equipment Use, Top 5 Equipment &amp; Consumables, Laboratory Frequency Usage and Recent Activity for end-term review.</li>
          <li>Provide a laboratory information chatbot that requires login and inventory recommendations for Head Laboratory. Both features must state when the available records are insufficient and must not change transactions automatically.</li>
        </ol>
        <h3 id="scope">1.3 Scope and Limitations</h3>
        <h4>1.3.1 Scope</h4>
        <ol type="1" start={1} className="academic-numbered-list">
          <li><strong>Users and laboratories.</strong> The system covers the Physics and Circuits laboratories of NU Fairview. Its users are Class Representatives, Faculty, the Dean, Circuits Laboratory Staff, Physics Laboratory Staff and Head Laboratory, with access based on their responsibilities and laboratory assignments.</li>
          <li><strong>Account management.</strong> Head Laboratory manually creates and manages Faculty and Class Representative accounts. Faculty verifies the representative's name, student ID and section and distributes the credentials. Neither role self-registers. The Dean retains a pre-assigned account, while classmates' reservation requests are submitted through their Class Representative's account.</li>
          <li><strong>Reservations and approvals.</strong> Class Representatives submit on-schedule or out-of-schedule requests for a selected group or individual student. On-schedule requests require assigned Faculty approval. Out-of-schedule requests go to available Faculty or directly to the Dean when Faculty is unavailable; the selected reviewer makes the final decision. Faculty requests for regular scheduled classes require no academic approval, while out-of-schedule requests require Dean approval. Availability checks and status tracking require login. The system does not provide a public kiosk or email approval without an account.</li>
          <li><strong>Inventory and borrowing.</strong> Staff manage inventory, equipment issuance, returns and disposal within their assigned laboratory. Issuance requires the applicable final approval. Borrowing and return records identify the actual group or individual borrower and distinguish reusable equipment from consumed supplies.</li>
          <li><strong>Administration and clearance.</strong> Head Laboratory manages schedules, daily tasks, clearance and reporting across both laboratories. After reviewing a return issue, Head Laboratory identifies the accountable student and creates the clearance record. Class Representatives can view clearance status for students in their class but cannot request or issue clearance.</li>
          <li><strong>Logs and reports.</strong> The system automatically records completed reservations and return outcomes in laboratory logs. End-term reports include Average Equipment Use, Top 5 Equipment &amp; Consumables, Laboratory Frequency Usage and Recent Activity. Average Use is calculated as quantity used divided by total available, multiplied by 100 and rounded to two decimal places. Frequency counts laboratory sessions per requester, not item rows. Disposal records, daily tasks, outstanding clearances and appendix content are excluded from these reports.</li>
          <li><strong>Laboratory inquiries.</strong> Class Representatives and Faculty may use the chatbot after logging in to obtain approved Physics and Circuits laboratory information, equipment information, current availability and operating hours. Schedule selection, reservation tracking and clearance remain on their respective pages.</li>
          <li><strong>Inventory forecasting.</strong> Head Laboratory may request next-month forecasts for either laboratory using existing stock and actual usage history. Forecasts estimate consumable needs and possible shortages of reusable equipment. Head Laboratory reviews these suggestions before making decisions. The results indicate when the available history is insufficient.</li>
        </ol>
        <h4>1.3.2 Limitations</h4>
        <ol type="1" start={1} className="academic-numbered-list">
          <li>The system does not process financial transactions, automate purchases, or allow AI to submit or approve reservations.</li>
          <li>Current availability information does not guarantee or reserve stock for a future laboratory session.</li>
          <li>Forecast reliability depends on accurate previous records and validated methods. A simple estimate based on usage is not presented as a trained AI model or a guarantee of future demand.</li>
          <li>AI-generated dashboard interpretations and report summaries are excluded. Inventory forecasts do not change stored stock.</li>
          <li>Rules for recurring requests and submission deadlines still require consultation and are not presented as completed features.</li>
          <li>Only the initial application structure has been created. Laboratory features still need to be developed. Security, browser compatibility and user acceptance testing also remain pending.</li>
        </ol>
      </div>
    </section>
  );
}

function MethodologySection({ onZoom }) {

        <p>The project follows the Agile methodology using the Scrum Framework. The team selected this approach because requirements continued to change as it gathered information.</p>
        <p>The project spans three (3) terms of thirteen and a half (13.5) weeks each. Each term corresponds to one subject and one release: MNTSDEV in the third term of the second year, MSYADD1 in the first term of the third year, and MCSPROJ in the second term of the third year.</p>
      </div>
      <Figure src="assets/figures/fig-scrum.png" caption="Figure 1: Scrum Framework" onZoom={onZoom} />
      <div className="lede" style={{marginTop:18}}>
        <p><strong>Product Vision.</strong> The product vision was developed during MNTSDEV from the problems identified by the Physics and Circuits laboratories and the Product Owner. Information on paper borrower's slips and laboratory service request forms must be entered again into digital records. Borrowing records in a Google Sheet and several workbooks are not linked to inventory, and room availability is checked using separate weekly grids. Approvals are signed on paper and stored outside the workbooks. Consumable quantities require a physical count.</p>
        <p><strong>Product Backlog and User Stories.</strong> The team expressed these objectives as User Stories in the Product Backlog shown in Table 1. They cover digital inventory and borrowing records, reservations with scheduling conflict checks, digital clearance, approval through logged-in Faculty and Dean accounts, request status updates, a laboratory Q&A chatbot that requires login, and waste disposal records. The team refines the backlog as consultations provide new information.</p>
        <p><strong>Sprint Planning.</strong> At the start of each Sprint, the team will select the backlog items it expects to complete, form the Sprint Backlog and set a Sprint Goal. The plan may be adjusted when new information becomes available or estimates prove inaccurate.</p>
        <p><strong>The Sprint.</strong> Sprints will have a fixed duration, to be decided when the development phase begins.</p>
        <p><strong>Sprint Review and Sprint Retrospective.</strong> Each Sprint will end with a Sprint Review followed by a Sprint Retrospective. During the Sprint Review, the team will present its work to Head Laboratory and adjust the backlog based on the feedback. During the Sprint Retrospective, the team will review how it worked together, the tools it used and its working process, then agree on at least one improvement for the next Sprint. The Sprint Review focuses on the product; the Sprint Retrospective focuses on the development process.</p>
        <p><strong>Product Backlog Refinement.</strong> The team uses findings from the Sprint Review and Sprint Retrospective to update the Product Backlog. The Product Owner reorders it before the next Sprint Planning session.</p>
        <p><strong>Current Status.</strong> As of this submission, the product vision, Product Backlog, requirements analysis, system models and prototype are complete or under revision. Only the initial Next.js application structure has been created; laboratory features have not yet been developed. All items in Table 1 remain Not Started. Sprint duration will be set when development begins.</p>
      </div>
    </section>
  );
}

    </section>
  );
}

    <section id="swimlane-diagram" className="doc-section sub">
      <SectionHeading level={3} kicker="2.3.5" title="Swimlane Diagram" id="swimlane-diagram" />
      <div className="lede"><p>Figure 16 organizes the workflow into six actor lanes, including the Dean. Head Laboratory may review inventory forecasts. Class Representatives select Group or Student Only, and the alternative routes meet at OR Join nodes. Head Laboratory identifies accountable students before creating clearance; Class Representatives can only view these records. Figures 11–15 provide the detailed workflows.</p></div>
      <Figure src="assets/system-diagrams/swimlane-system.png" caption="Figure 16: Whole-System Swimlane Diagram" onZoom={onZoom} editorHref="System-Diagrams.html#activity-system" />

    <p>Figures 17 and 18 show the system's transaction flow across two connected pages. Both show Class Representative, Faculty, Dean, Physics / Circuits Staff and Head Laboratory, followed by the system lifeline and Database Lifeline. Message numbering continues across pages. Page 1 covers account setup, request submission and the required final approval. Page 2 continues with issuance, returns, accountability, completed usage in D11 and End-Term reporting. Guarded Alternatives follow the conditions shown in the diagram; optional interactions occur only when selected. They do not all run in sequence. Each user receives only their own request or inquiry result. The five diagrams for individual processes remain available as detailed references.</p>
    <p><a className="figure-editor-link" href="Sequence-Overview.html">Open full-size two-page sequence overview</a> <a className="figure-editor-link" href="System-Diagrams.html#sequence">View the five detailed sequence diagrams</a></p>
    {[{id:'whole-1',title:'Account Setup, Requests and Approval'},{id:'whole-2',title:'Issuance, Returns and Reporting'}].map((f,i)=><div key={f.id} id={`sequence-${f.id}`} className="activity-process-page" data-sync-page-break={i>0 ? 'true' : undefined}>
      <SectionHeading level={4} title={`Page ${i+1} of 2 — ${f.title}`} id={`sequence-${f.id}`} />
      <Figure src={`assets/system-diagrams/sequence-${f.id}.png`} caption={`Figure ${17+i}: Whole-System Sequence Diagram — Page ${i+1} of 2`} onZoom={onZoom} editorHref={`Sequence-Overview.html#sequence-${f.id}`} />

/* ----------------------------- app shell ----------------------------- */
function App() {
  const flatIds = useMemo(() => flattenIds(NAV), []);
  const parentMap = useMemo(() => buildParentMap(NAV, null, {}), []);

  const [activeId, setActiveId] = useState(flatIds[0]);
  const [query, setQuery] = useState("");
  const [expanded, setExpanded] = useState({ requirements: true });
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [progress, setProgress] = useState(0);
  const [showTop, setShowTop] = useState(false);
  const [pageCount, setPageCount] = useState(0);
  const [pageStatus, setPageStatus] = useState("Preparing A4 pages…");
  const [currentPage, setCurrentPage] = useState(0);
  const [docZoom, setDocZoom] = useState(() => {
    const saved = Number(localStorage.getItem("somada-doc-zoom"));
    return Number.isFinite(saved) && saved >= 70 && saved <= 150 ? saved : 100;
  });
  const searchRef = useRef(null);
  const contentRef = useRef(null);
  const sourceRef = useRef(null);
  const pagesRef = useRef(null);
  const tickingRef = useRef(false);

  const changeDocZoom = useCallback((amount) => {
    setDocZoom(current => Math.max(70, Math.min(150, current + amount)));
  }, []);

  useEffect(() => {
    localStorage.setItem("somada-doc-zoom", String(docZoom));
  }, [docZoom]);

  const toggleExpand = useCallback((id) => {
    setExpanded(prev => ({ ...prev, [id]: !prev[id] }));
  }, []);

  const scrollToSection = useCallback((id) => {
    const el = window.DocumentPages && window.DocumentPages.find(pagesRef.current, id);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      history.replaceState(null, "", "#" + id);
      setActiveId(id);
    }
    setSidebarOpen(false);
  }, []);

  // Paginate once at physical A4 size. Zoom changes only the preview scale.
  useEffect(() => {
    let active = true;
    async function paginate() {
      try {
        // Deferred scripts finish before the load event, including a cached React boot.
        if (document.readyState !== "complete") await new Promise(resolve => window.addEventListener("load", resolve, {once:true}));
        const count = await window.DocumentPages.render(sourceRef.current, pagesRef.current, count => {
          if (active) setPageStatus(`Preparing A4 pages… ${count}`);
        });
        if (active) { setPageCount(count); setPageStatus(""); }
      } catch (error) {
        console.error("A4 pagination failed", error);
        if (active) setPageStatus(`Could not prepare A4 pages: ${error.message} Please reload to retry.`);
      }
    }
    paginate();
    return () => { active = false; };
  }, []);

  // Generated pages are clones, so delegate links and figure clicks here.
  const handlePageClick = useCallback((event) => {
    const link = event.target.closest('a[href^="#"]');
    if (link) { event.preventDefault(); scrollToSection(link.getAttribute("href").slice(1)); return; }
    const img = event.target.closest('.figure-frame img');
    if (img) setLightbox({src:img.src, caption:img.closest('figure').querySelector('figcaption').textContent});
  }, [scrollToSection]);

  // auto-expand ancestors of the active section
  useEffect(() => {
    let id = parentMap[activeId];
    const toOpen = {};
    while (id) { toOpen[id] = true; id = parentMap[id]; }
    if (Object.keys(toOpen).length) setExpanded(prev => ({ ...prev, ...toOpen }));
  }, [activeId, parentMap]);

  // scrollspy + reading progress, rAF-throttled
  useEffect(() => {
    const scroller = contentRef.current;
    if (!scroller) return;
    if (!pageCount) return;
    const els = flatIds.map(id => window.DocumentPages.find(pagesRef.current, id)).filter(Boolean);
    const pages = Array.from(pagesRef.current.querySelectorAll('.pagedjs_page'));
    function update() {
      const scrollTop = scroller.scrollTop;
      const max = scroller.scrollHeight - scroller.clientHeight;
      setProgress(max > 0 ? Math.min(100, (scrollTop / max) * 100) : 0);
      setShowTop(scrollTop > 800);

      const threshold = scroller.getBoundingClientRect().top + scroller.clientHeight * 0.28;
      let current = els[0] && els[0].id;
      for (const el of els) {
        if (el.getBoundingClientRect().top - threshold <= 0) current = el.dataset.sectionId; else break;
      }
      let pageNumber = 0;
      for (const page of pages) {
        if (page.getBoundingClientRect().top <= threshold) pageNumber = Number(page.dataset.pageNumber); else break;
      }
      setCurrentPage(pageNumber);
      setActiveId(prev => (prev === current ? prev : current));
      tickingRef.current = false;
    }
    function onScroll() {
      if (!tickingRef.current) { tickingRef.current = true; window.requestAnimationFrame(update); }
    }
    scroller.addEventListener("scroll", onScroll, { passive: true });
    update();
    return () => scroller.removeEventListener("scroll", onScroll);
  }, [flatIds, pageCount, docZoom]);

  // open a direct link's hash on first load
  useEffect(() => {
    if (pageCount && location.hash) {
      const id = location.hash.slice(1);
      const el = window.DocumentPages.find(pagesRef.current, id);
      if (el) el.scrollIntoView({ block: "start" });
    }
  }, [pageCount]);

  // "/" focuses search, unless already typing somewhere
  useEffect(() => {
    function onKey(e) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
        searchRef.current && searchRef.current.focus();
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <React.Fragment>
      <div className="progress-bar" style={{ width: progress + "%" }}></div>
      <div className="topbar">
        <div className="topbar-left">
          <button className="icon-btn menu-toggle" onClick={() => setSidebarOpen(o => !o)} aria-label="Toggle outline"><IconMenu /></button>
          <div className="brand">
            <div className="brand-badge">🧪</div>
            <div className="brand-text">
              <span className="brand-title">Laboratory System Documentation</span>
              <span className="brand-sub">Physics and Circuits Laboratory · NU Fairview · MSYADD1</span>
            </div>
          </div>
        </div>
        <div className="topbar-right">
          <span className="page-readout">{pageCount ? `${currentPage ? `Page ${currentPage}` : "Cover"} · ${pageCount} A4 sheets` : "A4 layout"}</span>
          <div className="doc-zoom-controls" role="group" aria-label="Document zoom controls">
            <button type="button" onClick={() => changeDocZoom(-10)} disabled={docZoom === 70} aria-label="Zoom document out" title="Zoom out">−</button>
            <button type="button" className="zoom-readout" onClick={() => setDocZoom(100)} aria-label={`Reset document zoom, currently ${docZoom}%`} title="Reset to 100%">{docZoom}%</button>
            <button type="button" onClick={() => changeDocZoom(10)} disabled={docZoom === 150} aria-label="Zoom document in" title="Zoom in">+</button>
          </div>
          <button className="icon-btn" disabled={!pageCount} onClick={() => window.print()}><IconPrint /> <span>Print / Export PDF</span></button>
          <button className="icon-btn" onClick={() => window.GoogleDocSync.open()} title="Update Google Docs" aria-label="Update Google Docs"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4" /></svg> <span>Update Google Docs</span></button>
        </div>
      </div>

      <nav className="page-tabs somada-nav nav-fixed" aria-label="Primary navigation">
  <a className="nav-brand" href="index.html" aria-label="Laboratory documentation home"><span className="nav-brand-mark">NU</span><span className="nav-brand-copy"><strong>NU Fairview Labs</strong><small>Documentation Suite</small></span></a>
  <div className="nav-links">
    <a className="page-tab" href="index.html">Home</a>
    <a className="page-tab active" href="Docs.html" aria-current="page">Documentation</a>
    <a className="page-tab" href="Analytics.html">Analytics</a>
    <a className="page-tab" href="System-Diagrams.html">System Diagrams</a>
    <a className="page-tab" href="Current-System.html">Current System</a>
    <a className="page-tab" href="assets/figures-v2/usecase-diagram-source.html">Use Case</a>
    <a className="page-tab" href="assets/figures-v2/dfd-level0/dfd-level0-source.html">DFD Level 0</a>
    <a className="page-tab" href="assets/figures-v2/dfd-level1/dfd-level1-source.html">DFD Level 1</a>
    <a className="page-tab" href="assets/figures-v2/dfd-level2-compact/dfd-level2-compact.html">DFD Level 2</a>
    <a className="page-tab" href="ERD.html">ERD</a>
    <a className="page-tab" href="assets/downloads/dfd-arrow-integrity-skill.zip" download="dfd-arrow-integrity-skill.zip">Download Skill</a>
  </div>
  <a className="page-tab nav-google-docs" href="https://docs.google.com/document/d/1UfFa6G0eWenSY_KjokZoOHqrQ2ajKGVgIwU56dkjpzY/edit" target="_blank" rel="noopener noreferrer" title="Open Google Docs in a new tab">Google Docs ↗</a>
</nav>

      <div className="shell">
        {sidebarOpen && <div className="sidebar-scrim show" onClick={() => setSidebarOpen(false)}></div>}
        <Sidebar activeId={activeId} onNavigate={scrollToSection} open={sidebarOpen} query={query} setQuery={setQuery}
          expanded={expanded} toggleExpand={toggleExpand} searchRef={searchRef} />

        <main ref={contentRef} className="content-wrap" role="main">
          <div className="pagination-status" role="status">{pageStatus}</div>
          <div ref={pagesRef} className="doc-pages a4-document" style={{zoom: docZoom / 100}} onClick={handlePageClick} aria-label="A4 document pages" />
          <div ref={sourceRef} className="paper doc-source a4-document" aria-hidden="true" inert="">
            <CoverSection />
            <TocSection onNavigate={scrollToSection} />
            <OverviewSection />
            <MethodologySection onZoom={setLightbox} />
            <RequirementsIntro />
            <BacklogSection />
            <EventsSection />
            <UseCaseDiagramsSection onZoom={setLightbox} />
            <UseCaseFullSection />
            <GapAnalysisSection />
            <section id="system-analysis" className="doc-section"><SectionHeading title="2.3 System Analysis and Design" id="system-analysis" /></section>
            <ContextDiagramSection onZoom={setLightbox} />
            <DfdSection onZoom={setLightbox} />
            <ErdSection onZoom={setLightbox} />
            <ActivityDiagramsSection onZoom={setLightbox} />
            <SwimlaneDiagramSection onZoom={setLightbox} />
            <SequenceDiagramSection onZoom={setLightbox} />
            <DeploymentDiagramSection onZoom={setLightbox} />
            <section id="references" className="doc-section"><SectionHeading title="References" id="references" />{(window.FinalTermReferences || []).map((reference,i)=><p key={i}>{reference}</p>)}</section>
            <Footer />
          </div>
        </main>
      </div>

      <button className={`back-to-top ${showTop ? "show" : ""}`} onClick={() => contentRef.current && contentRef.current.scrollTo({ top: 0, behavior: "smooth" })} aria-label="Back to top">
        <IconUp />
      </button>

      {lightbox && <Lightbox src={lightbox.src} caption={lightbox.caption} onClose={() => setLightbox(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Explicit transform (rather than Babel's auto data-presets scan) so this
  // works the same regardless of Babel-standalone version quirks.
  var appCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(appCode, { presets: ["react"] }).code;
  var runner = document.createElement("script");
  runner.textContent = compiled;
  document.body.appendChild(runner);
</script>
