<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A4 - Service Requests and Immutable Revisions" data-erd-page="requests"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A4 - Service Requests and Immutable Revisions</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="SERVICE_REQUEST"><rect x="24" y="100" width="262" height="114" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >SERVICE_REQUEST</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D2 | Demo</text><g data-field="SERVICE_REQUEST.request_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >request_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="SERVICE_REQUEST.reference_no"><text x="31" y="154" font-size="7.8" font-weight="700" >UK</text><text x="64" y="154" font-size="8.3" font-weight="400" >reference_no</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="280" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g><g data-field="SERVICE_REQUEST.requester_id"><text x="31" y="168" font-size="7.8" font-weight="700" >FK</text><text x="64" y="168" font-size="8.3" font-weight="400" >requester_id</text><text x="240" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R17</text></g><g data-field="SERVICE_REQUEST.status"><text x="64" y="182" font-size="8.3" font-weight="400" >status</text><text x="240" y="182" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="SERVICE_REQUEST.submitted_at"><text x="64" y="196" font-size="8.3" font-weight="400" >submitted_at</text><text x="240" y="196" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="227" font-size="8.1" font-weight="400" >Submitted request header shown in Dean, requester</text><text x="26" y="239.1" font-size="8.1" font-weight="400" >status and laboratory Staff request queues.</text><text x="26" y="264.2" font-size="7.6" font-weight="400" >requester_id must reference CLASSREP or FACULTY.</text><text x="26" y="275.8" font-size="7.6" font-weight="400" >Identity, reference and initial status are derived on</text><text x="26" y="287.4" font-size="7.6" font-weight="400" >the server.</text><g data-full-table="REQUEST_REVISION"><rect x="309" y="100" width="262" height="282" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,126H571" stroke="#a6b8c8"/><text x="317" y="117" font-size="10" font-weight="700" >REQUEST_REVISION</text><text x="563" y="117" font-size="7.4" font-weight="400" text-anchor="end">D2 | Demo</text><g data-field="REQUEST_REVISION.revision_id"><text x="316" y="140" font-size="7.8" font-weight="700" >PK</text><text x="349" y="140" font-size="8.3" font-weight="400" >revision_id</text><text x="525" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="REQUEST_REVISION.request_id"><text x="316" y="154" font-size="7.8" font-weight="700" >FK</text><text x="349" y="154" font-size="8.3" font-weight="400" >request_id</text><text x="525" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R18</text></g><g data-field="REQUEST_REVISION.lab_id"><text x="316" y="168" font-size="7.8" font-weight="700" >FK</text><text x="349" y="168" font-size="8.3" font-weight="400" >lab_id</text><text x="525" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R19</text></g><g data-field="REQUEST_REVISION.group_id"><text x="316" y="182" font-size="7.8" font-weight="700" >FK</text><text x="349" y="182" font-size="8.3" font-weight="400" >group_id</text><text x="525" y="182" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="182" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R20</text></g><g data-field="REQUEST_REVISION.room_id"><text x="316" y="196" font-size="7.8" font-weight="700" >FK</text><text x="349" y="196" font-size="8.3" font-weight="400" >room_id</text><text x="525" y="196" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="196" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R21</text></g><g data-field="REQUEST_REVISION.regular_schedule_id"><text x="316" y="210" font-size="7.8" font-weight="700" >FK</text><text x="349" y="210" font-size="8.3" font-weight="400" >regular_schedule_id ?</text><text x="525" y="210" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="210" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R22</text></g><g data-field="REQUEST_REVISION.created_by"><text x="316" y="224" font-size="7.8" font-weight="700" >FK</text><text x="349" y="224" font-size="8.3" font-weight="400" >created_by</text><text x="525" y="224" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="224" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R23</text></g><g data-field="REQUEST_REVISION.revision_no"><text x="349" y="238" font-size="8.3" font-weight="400" >revision_no</text><text x="525" y="238" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="REQUEST_REVISION.request_type"><text x="349" y="252" font-size="8.3" font-weight="400" >request_type ?</text><text x="525" y="252" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="REQUEST_REVISION.activity_type"><text x="349" y="266" font-size="8.3" font-weight="400" >activity_type ?</text><text x="525" y="266" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="REQUEST_REVISION.schedule_type"><text x="349" y="280" font-size="8.3" font-weight="400" >schedule_type</text><text x="525" y="280" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="REQUEST_REVISION.request_for"><text x="349" y="294" font-size="8.3" font-weight="400" >request_for</text><text x="525" y="294" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="REQUEST_REVISION.starts_at"><text x="349" y="308" font-size="8.3" font-weight="400" >starts_at</text><text x="525" y="308" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="REQUEST_REVISION.ends_at"><text x="349" y="322" font-size="8.3" font-weight="400" >ends_at</text><text x="525" y="322" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="REQUEST_REVISION.notes"><text x="349" y="336" font-size="8.3" font-weight="400" >notes ?</text><text x="525" y="336" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="REQUEST_REVISION.is_current"><text x="349" y="350" font-size="8.3" font-weight="400" >is_current</text><text x="525" y="350" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g><g data-field="REQUEST_REVISION.created_at"><text x="349" y="364" font-size="8.3" font-weight="400" >created_at</text><text x="525" y="364" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="311" y="395" font-size="8.1" font-weight="400" >Detached request snapshot: laboratory, class,</text><text x="311" y="407.1" font-size="8.1" font-weight="400" >room/time, request/activity type and notes.</text><text x="311" y="432.2" font-size="7.6" font-weight="400" >Unique: request_id + revision_no.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">5 / 15</text></svg>