<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A8 - Student Clearance and Laboratory Logs" data-erd-page="administration"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A8 - Student Clearance and Laboratory Logs</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="CLEARANCE"><rect x="24" y="100" width="262" height="184" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >CLEARANCE</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D6 | Future</text><g data-field="CLEARANCE.clearance_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >clearance_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="CLEARANCE.return_entry_id"><text x="31" y="154" font-size="7.8" font-weight="700" >FK</text><text x="64" y="154" font-size="8.3" font-weight="400" >return_entry_id</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R52</text></g><g data-field="CLEARANCE.borrow_member_id"><text x="31" y="168" font-size="7.8" font-weight="700" >FK</text><text x="64" y="168" font-size="8.3" font-weight="400" >borrow_member_id</text><text x="240" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R53</text></g><g data-field="CLEARANCE.raised_by"><text x="31" y="182" font-size="7.8" font-weight="700" >FK</text><text x="64" y="182" font-size="8.3" font-weight="400" >raised_by</text><text x="240" y="182" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="182" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R54</text></g><g data-field="CLEARANCE.settled_by"><text x="31" y="196" font-size="7.8" font-weight="700" >FK</text><text x="64" y="196" font-size="8.3" font-weight="400" >settled_by ?</text><text x="240" y="196" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="196" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R55</text></g><g data-field="CLEARANCE.quantity"><text x="64" y="210" font-size="8.3" font-weight="400" >quantity</text><text x="240" y="210" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="CLEARANCE.reason"><text x="64" y="224" font-size="8.3" font-weight="400" >reason</text><text x="240" y="224" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="CLEARANCE.status"><text x="64" y="238" font-size="8.3" font-weight="400" >status</text><text x="240" y="238" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="CLEARANCE.raised_at"><text x="64" y="252" font-size="8.3" font-weight="400" >raised_at</text><text x="240" y="252" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="CLEARANCE.settled_at"><text x="64" y="266" font-size="8.3" font-weight="400" >settled_at ?</text><text x="240" y="266" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="297" font-size="8.1" font-weight="400" >Student liabilities from a documented return and</text><text x="26" y="309.1" font-size="8.1" font-weight="400" >accountable selected participant.</text><text x="26" y="334.2" font-size="7.6" font-weight="400" >Clearance remains a Classrep/student workflow. Faculty</text><text x="26" y="345.8" font-size="7.6" font-weight="400" >has no clearance page or implied student participants.</text><g data-full-table="USAGE_LOG"><rect x="309" y="100" width="262" height="142" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,126H571" stroke="#a6b8c8"/><text x="317" y="117" font-size="10" font-weight="700" >USAGE_LOG</text><text x="563" y="117" font-size="7.4" font-weight="400" text-anchor="end">D11 | Future</text><g data-field="USAGE_LOG.usage_id"><text x="316" y="140" font-size="7.8" font-weight="700" >PK</text><text x="349" y="140" font-size="8.3" font-weight="400" >usage_id</text><text x="525" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="USAGE_LOG.reservation_id"><text x="316" y="154" font-size="7.8" font-weight="700" >FK</text><text x="349" y="154" font-size="8.3" font-weight="400" >reservation_id</text><text x="525" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R56</text></g><g data-field="USAGE_LOG.borrowing_id"><text x="316" y="168" font-size="7.8" font-weight="700" >FK</text><text x="349" y="168" font-size="8.3" font-weight="400" >borrowing_id ?</text><text x="525" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R57</text></g><g data-field="USAGE_LOG.recorded_by"><text x="316" y="182" font-size="7.8" font-weight="700" >FK</text><text x="349" y="182" font-size="8.3" font-weight="400" >recorded_by</text><text x="525" y="182" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="182" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R58</text></g><g data-field="USAGE_LOG.actual_start"><text x="349" y="196" font-size="8.3" font-weight="400" >actual_start</text><text x="525" y="196" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="USAGE_LOG.actual_end"><text x="349" y="210" font-size="8.3" font-weight="400" >actual_end</text><text x="525" y="210" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="USAGE_LOG.remarks"><text x="349" y="224" font-size="8.3" font-weight="400" >remarks ?</text><text x="525" y="224" font-size="7.4" font-weight="400" text-anchor="end">text</text></g></g><text x="311" y="255" font-size="8.1" font-weight="400" >Actual laboratory use after a reservation; distinct</text><text x="311" y="267.1" font-size="8.1" font-weight="400" >from planned time.</text><text x="311" y="292.2" font-size="7.6" font-weight="400" >Room-only use can have no borrowing slip. Faculty</text><text x="311" y="303.8" font-size="7.6" font-weight="400" >identity comes from the reservation class assignment.</text><g data-full-table="DAILY_TASK"><rect x="309" y="337.4" width="262" height="170" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,363.4H571" stroke="#a6b8c8"/><text x="317" y="354.4" font-size="10" font-weight="700" >DAILY_TASK</text><text x="563" y="354.4" font-size="7.4" font-weight="400" text-anchor="end">D7 | Future</text><g data-field="DAILY_TASK.task_id"><text x="316" y="377.4" font-size="7.8" font-weight="700" >PK</text><text x="349" y="377.4" font-size="8.3" font-weight="400" >task_id</text><text x="525" y="377.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="DAILY_TASK.lab_id"><text x="316" y="391.4" font-size="7.8" font-weight="700" >FK</text><text x="349" y="391.4" font-size="8.3" font-weight="400" >lab_id</text><text x="525" y="391.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="391.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R59</text></g><g data-field="DAILY_TASK.recorded_by"><text x="316" y="405.4" font-size="7.8" font-weight="700" >FK</text><text x="349" y="405.4" font-size="8.3" font-weight="400" >recorded_by</text><text x="525" y="405.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="405.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R60</text></g><g data-field="DAILY_TASK.task_date"><text x="349" y="419.4" font-size="8.3" font-weight="400" >task_date</text><text x="525" y="419.4" font-size="7.4" font-weight="400" text-anchor="end">date</text></g><g data-field="DAILY_TASK.activity"><text x="349" y="433.4" font-size="8.3" font-weight="400" >activity</text><text x="525" y="433.4" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="DAILY_TASK.status"><text x="349" y="447.4" font-size="8.3" font-weight="400" >status</text><text x="525" y="447.4" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="DAILY_TASK.work_availability"><text x="349" y="461.4" font-size="8.3" font-weight="400" >work_availability</text><text x="525" y="461.4" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="DAILY_TASK.overtime_hours"><text x="349" y="475.4" font-size="8.3" font-weight="400" >overtime_hours</text><text x="525" y="475.4" font-size="7.4" font-weight="400" text-anchor="end">numeric</text></g><g data-field="DAILY_TASK.remarks"><text x="349" y="489.4" font-size="8.3" font-weight="400" >remarks ?</text><text x="525" y="489.4" font-size="7.4" font-weight="400" text-anchor="end">text</text></g></g><text x="311" y="520.4" font-size="8.1" font-weight="400" >Laboratory Staff work log retained for the broader</text><text x="311" y="532.5" font-size="8.1" font-weight="400" >documented system.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">9 / 15</text></svg>