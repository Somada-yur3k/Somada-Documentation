 font-weight="400" >stock_quantity</text><text x="525" y="224" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="ITEM.condition_status"><text x="349" y="238" font-size="8.3" font-weight="400" >condition_status</text><text x="525" y="238" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="ITEM.reorder_level"><text x="349" y="252" font-size="8.3" font-weight="400" >reorder_level</text><text x="525" y="252" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="ITEM.active"><text x="349" y="266" font-size="8.3" font-weight="400" >active</text><text x="525" y="266" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g><g data-field="ITEM.updated_at"><text x="349" y="280" font-size="8.3" font-weight="400" >updated_at</text><text x="525" y="280" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="311" y="311" font-size="8.1" font-weight="400" >Inventory row owned by one laboratory; shared</text><text x="311" y="323.1" font-size="8.1" font-weight="400" >equipment types still have distinct stock per lab.</text><text x="311" y="348.2" font-size="7.6" font-weight="400" >Unique: lab_id + item_name.</text><g data-full-table="STOCK_MOVEMENT"><rect x="24" y="231.2" width="262" height="184" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,257.2H286" stroke="#a6b8c8"/><text x="32" y="248.2" font-size="10" font-weight="700" >STOCK_MOVEMENT</text><text x="278" y="248.2" font-size="7.4" font-weight="400" text-anchor="end">D4 | Future</text><g data-field="STOCK_MOVEMENT.movement_id"><text x="31" y="271.2" font-size="7.8" font-weight="700" >PK</text><text x="64" y="271.2" font-size="8.3" font-weight="400" >movement_id</text><text x="240" y="271.2" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="STOCK_MOVEMENT.item_id"><text x="31" y="285.2" font-size="7.8" font-weight="700" >FK</text><text x="64" y="285.2" font-size="8.3" font-weight="400" >item_id</text><text x="240" y="285.2" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="285.2" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R34</text></g><g data-field="STOCK_MOVEMENT.recorded_by"><text x="31" y="299.2" font-size="7.8" font-weight="700" >FK</text><text x="64" y="299.2" font-size="8.3" font-weight="400" >recorded_by</text><text x="240" y="299.2" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="299.2" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R35</text></g><g data-field="STOCK_MOVEMENT.borrowing_item_id"><text x="31" y="313.2" font-size="7.8" font-weight="700" >FK</text><text x="64" y="313.2" font-size="8.3" font-weight="400" >borrowing_item_id ?</text><text x="240" y="313.2" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="313.2" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R36</text></g><g data-field="STOCK_MOVEMENT.return_entry_id"><text x="31" y="327.2" font-size="7.8" font-weight="700" >FK</text><text x="64" y="327.2" font-size="8.3" font-weight="400" >return_entry_id ?</text><text x="240" y="327.2" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="327.2" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R37</text></g><g data-field="STOCK_MOVEMENT.disposal_id"><text x="31" y="341.2" font-size="7.8" font-weight="700" >FK</text><text x="64" y="341.2" font-size="8.3" font-weight="400" >disposal_id ?</text><text x="240" y="341.2" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="341.2" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R38</text></g><g data-field="STOCK_MOVEMENT.on_hand_delta"><text x="64" y="355.2" font-size="8.3" font-weight="400" >on_hand_delta</text><text x="240" y="355.2" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="STOCK_MOVEMENT.owned_delta"><text x="64" y="369.2" font-size="8.3" font-weight="400" >owned_delta</text><text x="240" y="369.2" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="STOCK_MOVEMENT.movement_type"><text x="64" y="383.2" font-size="8.3" font-weight="400" >movement_type</text><text x="240" y="383.2" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="STOCK_MOVEMENT.recorded_at"><text x="64" y="397.2" font-size="8.3" font-weight="400" >recorded_at</text><text x="240" y="397.2" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="428.2" font-size="8.1" font-weight="400" >Auditable stock ledger for receipts, adjustments,</text><text x="26" y="440.3" font-size="8.1" font-weight="400" >issues, returns, consumption and disposal.</text><text x="26" y="465.4" font-size="7.6" font-weight="400" >Update ITEM stock and the source transaction in the</text><text x="26" y="477" font-size="7.6" font-weight="400" >same database transaction. Ledger posting is not yet</text><text x="26" y="488.59999999999997" font-size="7.6" font-weight="400" >implemented.</text><g data-full-table="DISPOSAL"><rect x="309" y="381.8" width="262" height="170" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,407.8H571" stroke="#a6b8c8"/><text x="317" y="398.8" font-size="10" font-weight="700" >DISPOSAL</text><text x="563" y="398.8" font-size="7.4" font-weight="400" text-anchor="end">D10 | Future</text><g data-field="DISPOSAL.disposal_id"><text x="316" y="421.8" font-size="7.8" font-weight="700" >PK</text><text x="349" y="421.8" font-size="8.3" font-weight="400" >disposal_id</text><text x="525" y="421.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="DISPOSAL.item_id"><text x="316" y="435.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="435.8" font-size="8.3" font-weight="400" >item_id</text><text x="525" y="435.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="435.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R39</text></g><g data-field="DISPOSAL.recorded_by"><text x="316" y="449.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="449.8" font-size="8.3" font-weight="400" >recorded_by</text><text x="525" y="449.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="449.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R40</text></g><g data-field="DISPOSAL.return_entry_id"><text x="316" y="463.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="463.8" font-size="8.3" font-weight="400" >return_entry_id ?</text><text x="525" y="463.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="463.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R41</text></g><g data-field="DISPOSAL.quantity"><text x="349" y="477.8" font-size="8.3" font-weight="400" >quantity</text><text x="525" y="477.8" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="DISPOSAL.waste_class"><text x="349" y="491.8" font-size="8.3" font-weight="400" >waste_class</text><text x="525" y="491.8" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="DISPOSAL.reason"><text x="349" y="505.8" font-size="8.3" font-weight="400" >reason</text><text x="525" y="505.8" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="DISPOSAL.disposed_at"><text x="349" y="519.8" font-size="8.3" font-weight="400" >disposed_at</text><text x="525" y="519.8" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="DISPOSAL.status"><text x="349" y="533.8" font-size="8.3" font-weight="400" >status</text><text x="525" y="533.8" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g></g><text x="311" y="564.8" font-size="8.1" font-weight="400" >Documented physical waste disposal; lost items are</text><text x="311" y="576.9" font-size="8.1" font-weight="400" >not physical waste.</text><text x="311" y="602" font-size="7.6" font-weight="400" >Disposal quantity must be positive and supported by</text><text x="311" y="613.6" font-size="7.6" font-weight="400" >physical stock or a damaged return.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">7 / 15</text></svg>