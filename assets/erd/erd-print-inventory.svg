<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A6 - Laboratory Inventory and Stock Ledger" data-erd-page="inventory"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A6 - Laboratory Inventory and Stock Ledger</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="ITEM_CATEGORY"><rect x="24" y="100" width="262" height="72" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >ITEM_CATEGORY</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D4 | Demo</text><g data-field="ITEM_CATEGORY.category_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >category_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="ITEM_CATEGORY.category_name"><text x="31" y="154" font-size="7.8" font-weight="700" >UK</text><text x="64" y="154" font-size="8.3" font-weight="400" >category_name</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="280" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g></g><text x="26" y="185" font-size="8.1" font-weight="400" >Category tags for equipment/material search and</tex