<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A2 - Faculty, Classrep and Class Membership" data-erd-page="classes"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A2 - Faculty, Classrep and Class Membership</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="FACULTY_SECTION"><rect x="24" y="100" width="262" height="114" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >FACULTY_SECTION</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D1 | Demo</text><g data-field="FACULTY_SECTION.faculty_section_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >faculty_section_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="FACULTY_SECTION.faculty_id"><text x="31" y="154" font-size="7.8" font-weight="700" >FK</text><text x="64" y="154" font-size="8.3" font-weight="400" >faculty_id</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R03</text></g><g data-field="FACULTY_SECTION.section_id"><text x="31" y="168" font-size="7.8" font-weight="700" >FK</text><text x="64" y="168" font-size="8.3" font-weight="400" >section_id</text><text x="240" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R04</text></g><g data-field="FACULTY_SECTION.lab_id"><text x="31" y="182" font-size="7.8" font-weight="700" >FK</text><text x="64" y="182" font-size="8.3" font-weight="400" >lab_id</text><text x="240" y="182" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="182" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R05</text></g><g data-field="FACULTY_SECTION.active"><text x="64" y="196" font-size="8.3" font-weight="400" >active</text><text x="240" y="196" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g></g><text x="26" y="227" font-size="8.1" font-weight="400" >Many assigned sections per Faculty, scoped to a</text><text x="26" y="239.1" font-size="8.1" font-weight="400" >laboratory before a subject/class is created.</text><text x="26" y="264.2" font-size="7.6" font-weight="400" >Unique: faculty_id + section_id + lab_id.</text><g data-full-table="CLASS_GROUP"><rect x="309" y="100" width="262" height="128" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,126H571" stroke="#a6b8c8"/><text x="317" y="117" font-size="10" font-weight="700" >CLASS_GROUP</text><text x="563" y="117" font-size="7.4" font-weight="400" text-anchor="end">D1 | Demo</text><g data-field="CLASS_GROUP.group_id"><text x="316" y="140" font-size="7.8" font-weight="700" >PK</text><text x="349" y="140" font-size="8.3" font-weight="400" >group_id</text><text x="525" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="CLASS_GROUP.term_id"><text x="316" y="154" font-size="7.8" font-weight="700" >FK</text><text x="349" y="154" font-size="8.3" font-weight="400" >term_id</text><text x="525" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R06</text></g><g data-field="CLASS_GROUP.faculty_section_id"><text x="316" y="168" font-size="7.8" font-weight="700" >FK</text><text x="349" y="168" font-size="8.3" font-weight="400" >faculty_section_id</text><text x="525" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R07</text></g><g data-field="CLASS_GROUP.subject_code"><text x="349" y="182" font-size="8.3" font-weight="400" >subject_code</text><text x="525" y="182" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="CLASS_GROUP.subject_name"><text x="349" y="196" font-size="8.3" font-weight="400" >subject_name</text><text x="525" y="196" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="CLASS_GROUP.active"><text x="349" y="210" font-size="8.3" font-weight="400" >active</text><text x="525" y="210" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g></g><text x="311" y="241" font-size="8.1" font-weight="400" >Subject/class assignment. This table does not mean</text><text x="311" y="253.1" font-size="8.1" font-weight="400" >the Group request type.</text><text x="311" y="278.2" font-size="7.6" font-weight="400" >Unique: term_id + faculty_section_id + subject_code.</text><g data-full-table="CLASS_REP_ASSIGNMENT"><rect x="24" y="297.8" width="262" height="128" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,323.8H286" stroke="#a6b8c8"/><text x="32" y="314.8" font-size="10" font-weight="700" >CLASS_REP_ASSIGNMENT</text><text x="278" y="314.8" font-size="7.4" font-weight="400" text-anchor="end">D1 | Demo</text><g data-field="CLASS_REP_ASSIGNMENT.rep_assignment_id"><text x="31" y="337.8" font-size="7.8" font-weight="700" >PK</text><text x="64" y="337.8" font-size="8.3" font-weight="400" >rep_assignment_id</text><text x="240" y="337.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="CLASS_REP_ASSIGNMENT.account_id"><text x="31" y="351.8" font-size="7.8" font-weight="700" >FK</text><text x="64" y="351.8" font-size="8.3" font-weight="400" >account_id</text><text x="240" y="351.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="351.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R08</text></g><g data-field="CLASS_REP_ASSIGNMENT.section_id"><text x="31" y="365.8" font-size="7.8" font-weight="700" >FK</text><text x="64" y="365.8" font-size="8.3" font-weight="400" >section_id</text><text x="240" y="365.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="365.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R09</text></g><g data-field="CLASS_REP_ASSIGNMENT.group_id"><text x="31" y="379.8" font-size="7.8" font-weight="700" >FK</text><text x="64" y="379.8" font-size="8.3" font-weight="400" >group_id</text><text x="240" y="379.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="379.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R10</text></g><g data-field="CLASS_REP_ASSIGNMENT.active"><text x="64" y="393.8" font-size="8.3" font-weight="400" >active</text><text x="240" y="393.8" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g><g data-field="CLASS_REP_ASSIGNMENT.assigned_at"><text x="64" y="407.8" font-size="8.3" font-weight="400" >assigned_at</text><text x="240" y="407.8" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="438.8" font-size="8.1" font-weight="400" >Headlab Classrep form: fixed section, designated</text><text x="26" y="450.90000000000003" font-size="8.1" font-weight="400" >Faculty, laboratory and existing subject/class.</text><text x="26" y="476" font-size="7.6" font-weight="400" >account_id must reference a CLASSREP account.</text><g data-full-table="GROUP_MEMBER"><rect x="309" y="311.8" width="262" height="100" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,337.8H571" stroke="#a6b8c8"/><text x="317" y="328.8" font-size="10" font-weight="700" >GROUP_MEMBER</text><text x="563" y="328.8" font-size="7.4" font-weight="400" text-anchor="end">D1 | Future</text><g data-field="GROUP_MEMBER.group_member_id"><text x="316" y="351.8" font-size="7.8" font-weight="700" >PK</text><text x="349" y="351.8" font-size="8.3" font-weight="400" >group_member_id</text><text x="525" y="351.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="GROUP_MEMBER.group_id"><text x="316" y="365.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="365.8" font-size="8.3" font-weight="400" >group_id</text><text x="525" y="365.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="365.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R11</text></g><g data-field="GROUP_MEMBER.student_id"><text x="316" y="379.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="379.8" font-size="8.3" font-weight="400" >student_id</text><text x="525" y="379.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="379.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R12</text></g><g data-field="GROUP_MEMBER.active"><text x="349" y="393.8" font-size="8.3" font-weight="400" >active</text><text x="525" y="393.8" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g></g><text x="311" y="424.8" font-size="8.1" font-weight="400" >Authorized roster for the assigned subject/class;</text><text x="311" y="436.90000000000003" font-size="8.1" font-weight="400" >required for real participant ownership checks.</text><text x="311" y="462" font-size="7.6" font-weight="400" >Unique: group_id + student_id.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">3 / 15</text></svg>