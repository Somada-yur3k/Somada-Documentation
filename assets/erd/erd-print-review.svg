nt-size="8.1" font-weight="400" >equipment/materials; quantities are not issued stock.</text><text x="311" y="292.2" font-size="7.6" font-weight="400" >item_id may be null for Additional Items;</text><text x="311" y="303.8" font-size="7.6" font-weight="400" >name/type/quantity are still mandatory.</text><g data-full-table="REQUEST_MEMBER"><rect x="309" y="337.4" width="262" height="114" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,363.4H571" stroke="#a6b8c8"/><text x="317" y="354.4" font-size="10" font-weight="700" >REQUEST_MEMBER</text><text x="563" y="354.4" font-size="7.4" font-weight="400" text-anchor="end">D2 | Demo</text><g data-field="REQUEST_MEMBER.request_member_id"><text x="316" y="377.4" font-size="7.8" font-weight="700" >PK</text><text x="349" y="377.4" font-size="8.3" font-weight="400" >request_member_id</text><text x="525" y="377.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="REQUEST_MEMBER.revision_id"><text x="316" y="391.4" font-size="7.8" font-weight="700" >FK</text><text x="349" y="391.4" font-size="8.3" font-weight="400" >revision_id</text><text x="525" y="391.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="391.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R28</text></g><g data-field="REQUEST_MEMBER.student_id"><text x="316" y="405.4" font-size="7.8" font-weight="700" >FK</text><text x="349" y="405.4" font-size="8.3" font-weight="400" >student_id</text><text x="525" y="405.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="405.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R29</text></g><g data-field="REQUEST_MEMBER.name_snapshot"><text x="349" y="419.4" font-size="8.3" font-weight="400" >name_snapshot</text><text x="525" y="419.4" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="REQUEST_MEMBER.student_no_snapshot"><text x="349" y="433.4" font-size="8.3" font-weight="400" >student_no_snapshot</text><text x="525" y="433.4" font-size="7.4" font-weight="400" text-anchor="end">text</text></g></g><text x="311" y="464.4" font-size="8.1" font-weight="400" >Selected students for Classrep Group or Student Only,</text><text x="311" y="476.5" font-size="8.1" font-weight="400" >on both schedule variants.</text><text x="311" y="501.59999999999997" font-size="7.6" font-weight="400" >Unique: revision_id + student_id.</text><g data-full-table="RESERVATION"><rect x="24" y="351.4" width="262" height="114" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,377.4H286" stroke="#a6b8c8"/><text x="32" y="368.4" font-size="10" font-weight="700" >RESERVATION</text><text x="278" y="368.4" font-size="7.4" font-weight="400" text-anchor="end">D2 | Future</text><g data-field="RESERVATION.reservation_id"><text x="31" y="391.4" font-size="7.8" font-weight="700" >PK</text><text x="64" y="391.4" font-size="8.3" font-weight="400" >reservation_id</text><text x="240" y="391.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="RESERVATION.revision_id"><text x="31" y="405.4" font-size="7.8" font-weight="700" >FK/U</text><text x="64" y="405.4" font-size="8.3" font-weight="400" >revision_id</text><text x="240" y="405.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="405.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R30</text></g><g data-field="RESERVATION.processed_by"><text x="31" y="419.4" font-size="7.8" font-weight="700" >FK</text><text x="64" y="419.4" font-size="8.3" font-weight="400" >processed_by</text><text x="240" y="419.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="419.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R31</text></g><g data-field="RESERVATION.status"><text x="64" y="433.4" font-size="8.3" font-weight="400" >status</text><text x="240" y="433.4" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="RESERVATION.reserved_at"><text x="64" y="447.4" font-size="8.3" font-weight="400" >reserved_at</text><text x="240" y="447.4" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="478.4" font-size="8.1" font-weight="400" >Confirmed dated room booking, created only by later</text><text x="26" y="490.5" font-size="8.1" font-weight="400" >laboratory processing after any required academic</text><text x="26" y="502.59999999999997" font-size="8.1" font-weight="400" >approval.</text><text x="26" y="527.6999999999999" font-size="7.6" font-weight="400" >No reservation is created by the current Submit or</text><text x="26" y="539.3" font-size="7.6" font-weight="400" >Dean Approve actions.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">6 / 15</text></svg>