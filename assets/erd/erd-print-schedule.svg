<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A3 - Laboratories, Rooms and Regular Schedule" data-erd-page="schedule"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A3 - Laboratories, Rooms and Regular Schedule</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="LABORATORY"><rect x="24" y="100" width="262" height="100" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >LABORATORY</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D3 | Demo</text><g data-field="LABORATORY.lab_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >lab_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="LABORATORY.lab_code"><text x="31" y="154" font-size="7.8" font-weight="700" >UK</text><text x="64" y="154" font-size="8.3" font-weight="400" >lab_code</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="280" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g><g data-field="LABORATORY.lab_name"><text x="64" y="168" font-size="8.3" font-weight="400" >lab_name</text><text x="240" y="168" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="LABORATORY.active"><text x="64" y="182" font-size="8.3" font-weight="400" >active</text><text x="240" y="182" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g></g><text x="26" y="213" font-size="8.1" font-weight="400" >Physics or Circuits laboratory scope; one laboratory</text><text x="26" y="225.1" font-size="8.1" font-weight="400" >can contain several rooms.</text><text x="26" y="250.2" font-size="7.6" font-weight="400" >lab_code is PHYSICS or CIRCUITS. Staff data access</text><text x="26" y="261.8" font-size="7.6" font-weight="400" >uses this ID, not a room ID.</text><g data-full-table="LAB_ROOM"><rect x="309" y="100" width="262" height="100" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,126H571" stroke="#a6b8c8"/><text x="317" y="117" font-size="10" font-weight="700" >LAB_ROOM</text><text x="563" y="117" font-size="7.4" font-weight="400" text-anchor="end">D3 | Demo</text><g data-field="LAB_ROOM.room_id"><text x="316" y="140" font-size="7.8" font-weight="700" >PK</text><text x="349" y="140" font-size="8.3" font-weight="400" >room_id</text><text x="525" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="LAB_ROOM.lab_id"><text x="316" y="154" font-size="7.8" font-weight="700" >FK</text><text x="349" y="154" font-size="8.3" font-weight="400" >lab_id</text><text x="525" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R13</text></g><g data-field="LAB_ROOM.room_name"><text x="349" y="168" font-size="8.3" font-weight="400" >room_name</text><text x="525" y="168" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="LAB_ROOM.active"><text x="349" y="182" font-size="8.3" font-weight="400" >active</text><text x="525" y="182" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g></g><text x="311" y="213" font-size="8.1" font-weight="400" >Room Number choices under a laboratory, e.g. Physics</text><text x="311" y="225.1" font-size="8.1" font-weight="400" >201/202 and Circuits 301/302.</text><text x="311" y="250.2" font-size="7.6" font-weight="400" >Unique: lab_id + room_name.</text><g data-full-table="TERM"><rect x="309" y="283.8" width="262" height="100" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,309.8H571" stroke="#a6b8c8"/><text x="317" y="300.8" font-size="10" font-weight="700" >TERM</text><text x="563" y="300.8" font-size="7.4" font-weight="400" text-anchor="end">D3 | Future</text><g data-field="TERM.term_id"><text x="316" y="323.8" font-size="7.8" font-weight="700" >PK</text><text x="349" y="323.8" font-size="8.3" font-weight="400" >term_id</text><text x="525" y="323.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="TERM.term_code"><text x="316" y="337.8" font-size="7.8" font-weight="700" >UK</text><text x="349" y="337.8" font-size="8.3" font-weight="400" >term_code</text><text x="525" y="337.8" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="565" y="337.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g><g data-field="TERM.starts_on"><text x="349" y="351.8" font-size="8.3" font-weight="400" >starts_on</text><text x="525" y="351.8" font-size="7.4" font-weight="400" text-anchor="end">date</text></g><g data-field="TERM.ends_on"><text x="349" y="365.8" font-size="8.3" font-weight="400" >ends_on</text><text x="525" y="365.8" font-size="7.4" font-weight="400" text-anchor="end">date</text></g></g><text x="311" y="396.8" font-size="8.1" font-weight="400" >Term boundary for subject assignments and weekly</text><text x="311" y="408.90000000000003" font-size="8.1" font-weight="400" >schedules.</text><text x="311" y="434" font-size="7.6" font-weight="400" >starts_on &lt;= ends_on.</text><g data-full-table="REGULAR_SCHEDULE"><rect x="24" y="295.4" width="262" height="184" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,321.4H286" stroke="#a6b8c8"/><text x="32" y="312.4" font-size="10" font-weight="700" >REGULAR_SCHEDULE</text><text x="278" y="312.4" font-size="7.4" font-weight="400" text-anchor="end">D3 | Demo</text><g data-field="REGULAR_SCHEDULE.regular_schedule_id"><text x="31" y="335.4" font-size="7.8" font-weight="700" >PK</text><text x="64" y="335.4" font-size="8.3" font-weight="400" >regular_schedule_id</text><text x="240" y="335.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="REGULAR_SCHEDULE.term_id"><text x="31" y="349.4" font-size="7.8" font-weight="700" >FK</text><text x="64" y="349.4" font-size="8.3" font-weight="400" >term_id</text><text x="240" y="349.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="349.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R14</text></g><g data-field="REGULAR_SCHEDULE.room_id"><text x="31" y="363.4" font-size="7.8" font-weight="700" >FK</text><text x="64" y="363.4" font-size="8.3" font-weight="400" >room_id</text><text x="240" y="363.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="363.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R15</text></g><g data-field="REGULAR_SCHEDULE.group_id"><text x="31" y="377.4" font-size="7.8" font-weight="700" >FK</text><text x="64" y="377.4" font-size="8.3" font-weight="400" >group_id ?</text><text x="240" y="377.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="377.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R16</text></g><g data-field="REGULAR_SCHEDULE.block_type"><text x="64" y="391.4" font-size="8.3" font-weight="400" >block_type</text><text x="240" y="391.4" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="REGULAR_SCHEDULE.weekday"><text x="64" y="405.4" font-size="8.3" font-weight="400" >weekday</text><text x="240" y="405.4" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="REGULAR_SCHEDULE.start_time"><text x="64" y="419.4" font-size="8.3" font-weight="400" >start_time</text><text x="240" y="419.4" font-size="7.4" font-weight="400" text-anchor="end">time</text></g><g data-field="REGULAR_SCHEDULE.end_time"><text x="64" y="433.4" font-size="8.3" font-weight="400" >end_time</text><text x="240" y="433.4" font-size="7.4" font-weight="400" text-anchor="end">time</text></g><g data-field="REGULAR_SCHEDULE.valid_from"><text x="64" y="447.4" font-size="8.3" font-weight="400" >valid_from</text><text x="240" y="447.4" font-size="7.4" font-weight="400" text-anchor="end">date</text></g><g data-field="REGULAR_SCHEDULE.valid_until"><text x="64" y="461.4" font-size="8.3" font-weight="400" >valid_until</text><text x="240" y="461.4" font-size="7.4" font-weight="400" text-anchor="end">date</text></g></g><text x="26" y="492.4" font-size="8.1" font-weight="400" >Recurring laboratory or lecture blocks rendered by</text><text x="26" y="504.5" font-size="8.1" font-weight="400" >Room Availability.</text><text x="26" y="529.6" font-size="7.6" font-weight="400" >weekday is 1-6 (Monday-Saturday) in the current form.</text><text x="26" y="541.2" font-size="7.6" font-weight="400" >start_time &lt; end_time.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">4 / 15</text></svg>