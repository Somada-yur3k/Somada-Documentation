5" y="196" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="CHAT_EXCHANGE.response_status"><text x="349" y="210" font-size="8.3" font-weight="400" >response_status</text><text x="525" y="210" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="CHAT_EXCHANGE.asked_at"><text x="349" y="224" font-size="8.3" font-weight="400" >asked_at</text><text x="525" y="224" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="311" y="255" font-size="8.1" font-weight="400" >Future authenticated Lab Assistant question/answer</text><text x="311" y="267.1" font-size="8.1" font-weight="400" >history.</text><text x="311" y="292.2" font-size="7.6" font-weight="400" >Chat does not approve requests, reserve a room, mutate</text><text x="311" y="303.8" font-size="7.6" font-weight="400" >inventory or create a Forecast entity.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">10 / 15</text></svg>