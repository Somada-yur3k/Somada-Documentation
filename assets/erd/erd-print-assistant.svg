<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A9 - Lab Assistant Extension" data-erd-page="assistant"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A9 - Lab Assistant Extension</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="KNOWLEDGE_ARTICLE"><rect x="24" y="100" width="262" height="114" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >KNOWLEDGE_ARTICLE</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D8 | Future</text><g data-field="KNOWLEDGE_ARTICLE.article_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >article_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="KNOWLEDGE_ARTICLE.topic"><text x="64" y="154" font-size="8.3" font-weight="400" >topic</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="KNOWLEDGE_ARTICLE.content"><text x="64" y="168" font-size="8.3" font-weight="400" >content</text><text x="240" y="168" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="KNOWLEDGE_ARTICLE.category"><text x="64" y="182" font-size="8.3" font-weight="400"