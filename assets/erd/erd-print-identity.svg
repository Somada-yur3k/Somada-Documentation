_ACCOUNT.role"><text x="64" y="280" font-size="8.3" font-weight="400" >role</text><text x="240" y="280" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="USER_ACCOUNT.status"><text x="64" y="294" font-size="8.3" font-weight="400" >status</text><text x="240" y="294" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="USER_ACCOUNT.notes"><text x="64" y="308" font-size="8.3" font-weight="400" >notes ?</text><text x="240" y="308" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="USER_ACCOUNT.created_at"><text x="64" y="322" font-size="8.3" font-weight="400" >created_at</text><text x="240" y="322" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="USER_ACCOUNT.updated_at"><text x="64" y="336" font-size="8.3" font-weight="400" >updated_at</text><text x="240" y="336" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="367" font-size="8.1" font-weight="400" >Profile and role context for login, account</text><text x="26" y="379.1" font-size="8.1" font-weight="400" >management and staff scoping. account_id maps to</text><text x="26" y="391.2" font-size="8.1" font-weight="400" >Supabase auth.users.id at integration.</text><text x="26" y="416.3" font-size="7.6" font-weight="400" >Passwords belong to Supabase Auth; no password_hash or</text><text x="26" y="427.90000000000003" font-size="7.6" font-weight="400" >temporary password is stored in the profile.</text><g data-full-table="STUDENT"><rect x="309" y="100" width="262" height="100" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,126H571" stroke="#a6b8c8"/><text x="317" y="117" font-size="10" font-weight="700" >STUDENT</text><text x="563" y="117" font-size="7.4" font-weight="400" text-anchor="end">D1 | Demo</text><g data-field="STUDENT.student_id"><text x="316" y="140" font-size="7.8" font-weight="700" >PK</text><text x="349" y="140" font-size="8.3" font-weight="400" >student_id</text><text x="525" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="STUDENT.student_number"><text x="316" y="154" font-size="7.8" font-weight="700" >UK</text><text x="349" y="154" font-size="8.3" font-weight="400" >student_number</text><text x="525" y="154" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="565" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g><g data-field="STUDENT.full_name"><text x="349" y="168" font-size="8.3" font-weight="400" >full_name</text><text x="525" y="168" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="STUDENT.program"><text x="349" y="182" font-size="8.3" font-weight="400" >program ?</text><text x="525" y="182" font-size="7.4" font-weight="400" text-anchor="end">text</text></g></g><text x="311" y="213" font-size="8.1" font-weight="400" >Participant identity; NU ID is independent of the</text><text x="311" y="225.1" font-size="8.1" font-weight="400" >submitting Class Representative account.</text><text x="311" y="250.2" font-size="7.6" font-weight="400" >student_number matches YYYY-NNNNNNN, e.g.</text><text x="311" y="261.8" font-size="7.6" font-weight="400" >2024-1031816.</text><g data-full-table="SECTION"><rect x="309" y="295.4" width="262" height="100" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,321.4H571" stroke="#a6b8c8"/><text x="317" y="312.4" font-size="10" font-weight="700" >SECTION</text><text x="563" y="312.4" font-size="7.4" font-weight="400" text-anchor="end">D1 | Demo</text><g data-field="SECTION.section_id"><text x="316" y="335.4" font-size="7.8" font-weight="700" >PK</text><text x="349" y="335.4" font-size="8.3" font-weight="400" >section_id</text><text x="525" y="335.4" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="SECTION.section_code"><text x="316" y="349.4" font-size="7.8" font-weight="700" >UK</text><text x="349" y="349.4" font-size="8.3" font-weight="400" >section_code</text><text x="525" y="349.4" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="565" y="349.4" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g><g data-field="SECTION.program"><text x="349" y="363.4" font-size="8.3" font-weight="400" >program ?</text><text x="525" y="363.4" font-size="7.4" font-weight="400" text-anchor="end">text</text></g><g data-field="SECTION.active"><text x="349" y="377.4" font-size="8.3" font-weight="400" >active</text><text x="525" y="377.4" font-size="7.4" font-weight="400" text-anchor="end">boolean</text></g></g><text x="311" y="408.4" font-size="8.1" font-weight="400" >Named class section used by Faculty assignments and</text><text x="311" y="420.5" font-size="8.1" font-weight="400" >the fixed participant section.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">2 / 15</text></svg>