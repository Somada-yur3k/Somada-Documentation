<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.28 841.89" role="img" aria-label="A7 - Borrowing Slips, Issuance and Returns" data-erd-page="borrowing"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#183149}rect,line,path,circle{vector-effect:non-scaling-stroke} .fk{fill:#155a8c}.planned{fill:#925d10}[data-relation-row]:hover rect,[data-relation-row]:focus rect{fill:#e7f3ff}[data-relation-row]:focus{outline:none}</style><rect width="595.28" height="841.89" fill="white"/><text x="24" y="31" font-size="10" font-weight="700" >NU FAIRVIEW LABORATORY MANAGEMENT SYSTEM</text><text x="24" y="55" font-size="17" font-weight="700" >A7 - Borrowing Slips, Issuance and Returns</text><text x="24" y="73" font-size="8.4" font-weight="400" >Full definitions | ? = nullable | PK = primary key | FK = foreign key | U / UK = unique | Rxx = relationship ID</text><line x1="24" y1="82" x2="571" y2="82" stroke="#bdcbd8"/><g data-full-table="BORROWING"><rect x="24" y="100" width="262" height="170" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,126H286" stroke="#a6b8c8"/><text x="32" y="117" font-size="10" font-weight="700" >BORROWING</text><text x="278" y="117" font-size="7.4" font-weight="400" text-anchor="end">D5 | Demo</text><g data-field="BORROWING.borrowing_id"><text x="31" y="140" font-size="7.8" font-weight="700" >PK</text><text x="64" y="140" font-size="8.3" font-weight="400" >borrowing_id</text><text x="240" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="BORROWING.reservation_id"><text x="31" y="154" font-size="7.8" font-weight="700" >FK</text><text x="64" y="154" font-size="8.3" font-weight="400" >reservation_id</text><text x="240" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R42</text></g><g data-field="BORROWING.borrower_account_id"><text x="31" y="168" font-size="7.8" font-weight="700" >FK</text><text x="64" y="168" font-size="8.3" font-weight="400" >borrower_account_id</text><text x="240" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R43</text></g><g data-field="BORROWING.issued_by"><text x="31" y="182" font-size="7.8" font-weight="700" >FK</text><text x="64" y="182" font-size="8.3" font-weight="400" >issued_by</text><text x="240" y="182" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="182" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R44</text></g><g data-field="BORROWING.slip_no"><text x="31" y="196" font-size="7.8" font-weight="700" >UK</text><text x="64" y="196" font-size="8.3" font-weight="400" >slip_no</text><text x="240" y="196" font-size="7.4" font-weight="400" text-anchor="end">text</text><text x="280" y="196" font-size="7.5" font-weight="700" text-anchor="end" class="fk">UK</text></g><g data-field="BORROWING.issued_at"><text x="64" y="210" font-size="8.3" font-weight="400" >issued_at</text><text x="240" y="210" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="BORROWING.due_at"><text x="64" y="224" font-size="8.3" font-weight="400" >due_at</text><text x="240" y="224" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g><g data-field="BORROWING.status"><text x="64" y="238" font-size="8.3" font-weight="400" >status</text><text x="240" y="238" font-size="7.4" font-weight="400" text-anchor="end">enum</text></g><g data-field="BORROWING.closed_at"><text x="64" y="252" font-size="8.3" font-weight="400" >closed_at ?</text><text x="240" y="252" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="283" font-size="8.1" font-weight="400" >Borrowing slip header for the Staff record screen;</text><text x="26" y="295.1" font-size="8.1" font-weight="400" >issuance is a future transaction.</text><text x="26" y="320.2" font-size="7.6" font-weight="400" >Current Staff borrowing slips are isolated sample</text><text x="26" y="331.8" font-size="7.6" font-weight="400" >records, not created from demo requests. The target FK</text><text x="26" y="343.4" font-size="7.6" font-weight="400" >joins a slip to a confirmed reservation.</text><g data-full-table="BORROWING_ITEM"><rect x="309" y="100" width="262" height="114" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,126H571" stroke="#a6b8c8"/><text x="317" y="117" font-size="10" font-weight="700" >BORROWING_ITEM</text><text x="563" y="117" font-size="7.4" font-weight="400" text-anchor="end">D5 | Future</text><g data-field="BORROWING_ITEM.borrowing_item_id"><text x="316" y="140" font-size="7.8" font-weight="700" >PK</text><text x="349" y="140" font-size="8.3" font-weight="400" >borrowing_item_id</text><text x="525" y="140" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="BORROWING_ITEM.borrowing_id"><text x="316" y="154" font-size="7.8" font-weight="700" >FK</text><text x="349" y="154" font-size="8.3" font-weight="400" >borrowing_id</text><text x="525" y="154" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="154" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R45</text></g><g data-field="BORROWING_ITEM.request_item_id"><text x="316" y="168" font-size="7.8" font-weight="700" >FK</text><text x="349" y="168" font-size="8.3" font-weight="400" >request_item_id</text><text x="525" y="168" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="168" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R46</text></g><g data-field="BORROWING_ITEM.item_id"><text x="316" y="182" font-size="7.8" font-weight="700" >FK</text><text x="349" y="182" font-size="8.3" font-weight="400" >item_id</text><text x="525" y="182" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="182" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R47</text></g><g data-field="BORROWING_ITEM.qty_issued"><text x="349" y="196" font-size="8.3" font-weight="400" >qty_issued</text><text x="525" y="196" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g></g><text x="311" y="227" font-size="8.1" font-weight="400" >Actual issued quantities, separate from requested</text><text x="311" y="239.1" font-size="8.1" font-weight="400" >quantities.</text><text x="311" y="264.2" font-size="7.6" font-weight="400" >Unique: borrowing_id + request_item_id + item_id.</text><g data-full-table="BORROWING_MEMBER"><rect x="309" y="297.8" width="262" height="86" rx="4" fill="white" stroke="#a6b8c8"/><path d="M309,323.8H571" stroke="#a6b8c8"/><text x="317" y="314.8" font-size="10" font-weight="700" >BORROWING_MEMBER</text><text x="563" y="314.8" font-size="7.4" font-weight="400" text-anchor="end">D5 | Future</text><g data-field="BORROWING_MEMBER.borrow_member_id"><text x="316" y="337.8" font-size="7.8" font-weight="700" >PK</text><text x="349" y="337.8" font-size="8.3" font-weight="400" >borrow_member_id</text><text x="525" y="337.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="BORROWING_MEMBER.borrowing_id"><text x="316" y="351.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="351.8" font-size="8.3" font-weight="400" >borrowing_id</text><text x="525" y="351.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="351.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R48</text></g><g data-field="BORROWING_MEMBER.request_member_id"><text x="316" y="365.8" font-size="7.8" font-weight="700" >FK</text><text x="349" y="365.8" font-size="8.3" font-weight="400" >request_member_id</text><text x="525" y="365.8" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="565" y="365.8" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R49</text></g></g><text x="311" y="396.8" font-size="8.1" font-weight="400" >Accountable selected students, never all students in</text><text x="311" y="408.90000000000003" font-size="8.1" font-weight="400" >a section automatically.</text><text x="311" y="434" font-size="7.6" font-weight="400" >Unique: borrowing_id + request_member_id.</text><g data-full-table="RETURN_ENTRY"><rect x="24" y="377" width="262" height="156" rx="4" fill="white" stroke="#a6b8c8"/><path d="M24,403H286" stroke="#a6b8c8"/><text x="32" y="394" font-size="10" font-weight="700" >RETURN_ENTRY</text><text x="278" y="394" font-size="7.4" font-weight="400" text-anchor="end">D5 | Future</text><g data-field="RETURN_ENTRY.return_entry_id"><text x="31" y="417" font-size="7.8" font-weight="700" >PK</text><text x="64" y="417" font-size="8.3" font-weight="400" >return_entry_id</text><text x="240" y="417" font-size="7.4" font-weight="400" text-anchor="end">uuid</text></g><g data-field="RETURN_ENTRY.borrowing_item_id"><text x="31" y="431" font-size="7.8" font-weight="700" >FK</text><text x="64" y="431" font-size="8.3" font-weight="400" >borrowing_item_id</text><text x="240" y="431" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="431" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R50</text></g><g data-field="RETURN_ENTRY.received_by"><text x="31" y="445" font-size="7.8" font-weight="700" >FK</text><text x="64" y="445" font-size="8.3" font-weight="400" >received_by</text><text x="240" y="445" font-size="7.4" font-weight="400" text-anchor="end">uuid</text><text x="280" y="445" font-size="7.5" font-weight="700" text-anchor="end" class="fk">R51</text></g><g data-field="RETURN_ENTRY.qty_good"><text x="64" y="459" font-size="8.3" font-weight="400" >qty_good</text><text x="240" y="459" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="RETURN_ENTRY.qty_broken"><text x="64" y="473" font-size="8.3" font-weight="400" >qty_broken</text><text x="240" y="473" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="RETURN_ENTRY.qty_lost"><text x="64" y="487" font-size="8.3" font-weight="400" >qty_lost</text><text x="240" y="487" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="RETURN_ENTRY.qty_consumed"><text x="64" y="501" font-size="8.3" font-weight="400" >qty_consumed</text><text x="240" y="501" font-size="7.4" font-weight="400" text-anchor="end">integer</text></g><g data-field="RETURN_ENTRY.recorded_at"><text x="64" y="515" font-size="8.3" font-weight="400" >recorded_at</text><text x="240" y="515" font-size="7.4" font-weight="400" text-anchor="end">timestamptz</text></g></g><text x="26" y="546" font-size="8.1" font-weight="400" >Partial-return history and outcome quantities for</text><text x="26" y="558.1" font-size="8.1" font-weight="400" >each issued item.</text><text x="26" y="583.2" font-size="7.6" font-weight="400" >Quantities are nonnegative and total reconciled</text><text x="26" y="594.8000000000001" font-size="7.6" font-weight="400" >quantity cannot exceed issued quantity. At least one</text><text x="26" y="606.4000000000001" font-size="7.6" font-weight="400" >outcome quantity is positive.</text><text x="24" y="792" font-size="7.6" font-weight="400" >Cross-table lifecycle/role rules are listed in the dictionary and the final implementation boundary page.</text><line x1="24" y1="807" x2="571" y2="807" stroke="#bdcbd8"/><text x="24" y="823" font-size="7.7" font-weight="400" >Screen-aligned logical baseline | 27 September 2026 | Supabase not deployed</text><text x="571" y="823" font-size="8" font-weight="400" text-anchor="end">8 / 15</text></svg>