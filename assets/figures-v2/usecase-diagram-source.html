<div id="stage"></div>
<script>
/*
 * Three-column layout based on the project's Use Case Guide:
 *   left   = requester and approver processes
 *   center = supporting use cases with required <<include>> or conditional <<extend>> links
 *   right  = laboratory management processes
 * Actors remain outside the laboratory system boundary. Dashboard-only entries
 * are intentionally excluded so the diagram emphasizes business processes.
 */
const outputMode=['export','embed'].some(key=>new URLSearchParams(location.search).has(key));
if (outputMode) {
  document.body.classList.add('export-mode');
}

const ACTORS = [
  {
    id:'classrep', label:['Class Rep.'], color:'#2454a6', side:'left', cy:430,
    uses:['login','chooselab','viewsched','submitcombined','cancelres','reschedres','viewstatus','viewhistory','clearstatus','askq']
  },
  {
    id:'dean', label:['Dean'], color:'#7b68a6', side:'left', cy:950,
    uses:['login','approve']
  },
  {
    id:'faculty', label:['Faculty'], color:'#e08a00', side:'left', cy:1470,
    uses:['login','chooselab','viewsched','submitscheduled','submitcombined','cancelres','reschedres','viewstatus','viewhistory','approve','askq']
  },
  {
    id:'headlab', label:['Head','Laboratory'], color:'#2f7d1b', side:'right', cy:430,
    uses:['login','issueacct','mgminv','forecast','issueeq','procret','procclear','wastedisp','mgmlogs','endterm']
  },
  {
    id:'physics', label:['Physics','Lab Staff'], color:'#707782', side:'right', cy:950,
    uses:['login','mgminv','issueeq','procret','wastedisp']
  },
  {
    id:'circuits', label:['Circuits','Lab Staff'], color:'#182ed4', side:'right', cy:1470,
    uses:['login','mgminv','issueeq','procret','wastedisp']
  }
];

const BASE_UC = [
  {id:'login',       x:960, cy:205,  label:['Log In'], shared:true},

  {id:'chooselab',       x:650, cy:315,  label:['Choose Laboratory'], column:'left'},
  {id:'viewsched',       x:650, cy:425,  label:['View Schedule &','Availability'], column:'left'},
  {id:'submitscheduled', x:650, cy:535,  label:['Submit Scheduled','Laboratory Activity'], column:'left'},
  {id:'submitcombined',  x:650, cy:645,  label:['Submit On-Schedule','Non-Laboratory /','Out-of-Schedule Request'], column:'left', fontSize:13, lineHeight:15},
  {id:'cancelres',       x:650, cy:755,  label:['Cancel Laboratory','Reservation'], column:'left'},
  {id:'reschedres',      x:650, cy:865,  label:['Reschedule Laboratory','Reservation'], column:'left'},
  {id:'viewstatus',      x:650, cy:975,  label:['View Reservation','Status'], column:'left'},
  {id:'viewhistory',     x:650, cy:1085, label:['View Reservation','History'], column:'left'},
  {id:'clearstatus',     x:650, cy:1195, label:['View Clearance','Status'], column:'left'},
  {id:'approve',         x:650, cy:1305, label:['Approve / Reject','Routed Request'], column:'left'},
  {id:'askq',            x:650, cy:1605, label:['Ask Laboratory','Question'], column:'left'},

  {id:'issueacct',   x:1270, cy:390,  label:['Manage Class Representative /','Faculty Accounts'], column:'right'},
  {id:'mgminv',      x:1270, cy:570,  label:['Manage Equipment','Inventory'], column:'right'},
  {id:'issueeq',     x:1270, cy:750,  label:['Issue Equipment'], column:'right'},
  {id:'procret',     x:1270, cy:930,  label:['Process Return'], column:'right'},
  {id:'procclear',   x:1270, cy:1110, label:['Process Clearance'], column:'right'},
  {id:'wastedisp',   x:1270, cy:1290, label:['Log Waste','Disposal'], column:'right'},
  {id:'mgmlogs',     x:1270, cy:1470, label:['Manage Logs, Schedule','& Daily Tasks'], column:'right'},
  {id:'endterm',     x:1270, cy:1650, label:['Generate End-Term','Report'], column:'right'}
];

const SUPPORT_UC = [
  {id:'addeq',       x:960, cy:315,  label:['Add Equipment']},
  {id:'updateeq',    x:960, cy:405,  label:['Update Equipment']},
  {id:'deleteeq',    x:960, cy:495,  label:['Remove Equipment']},
  {id:'searcheq',    x:960, cy:585,  label:['Search & Filter','Inventory']},
  {id:'selectres',   x:960, cy:685,  label:['Select Resources /','Equipment']},
  {id:'recordblc',   x:960, cy:900,  label:['Record Broken / Lost','/ Consumed Items']},
  {id:'checkitem',   x:960, cy:1325, label:['Ask Equipment','Information /','Availability']},
  {id:'headinfo',  x:960, cy:1420, label:['Ask Circuits / Physics','Laboratory Information']},
  {id:'checkhours',  x:960, cy:1610, label:['Check Operating','Hours']},
  {id:'forecast', x:960, cy:1740, label:['Generate Inventory','Forecast']}
];

const RELATIONSHIPS = [
  {from:'mgminv',      to:'addeq',       type:'include'},
  {from:'mgminv',      to:'updateeq',    type:'include'},
  {from:'mgminv',      to:'deleteeq',    type:'include'},
  {from:'mgminv',      to:'searcheq',    type:'include'},
  {from:'submitscheduled', to:'selectres', type:'include'},
  {from:'submitcombined',  to:'selectres', type:'include'},
  {from:'recordblc',   to:'procret',     type:'extend'},
  {from:'checkitem',   to:'askq',        type:'extend'},
  {from:'headinfo',  to:'askq',        type:'extend'},
  {from:'checkhours',  to:'askq',        type:'extend'},
  {from:'forecast', to:'mgminv', type:'extend', condition:'Head Lab requests a next-month forecast'}
];

const CANVAS_W = 1600;
const CANVAS_H = 1800;
const BOUNDARY = {x:220, y:90, w:1160, h:1655};
const BASE_SIZE = {rx:115, ry:50};
const LOGIN_SIZE = {rx:125, ry:55};
const SUPPORT_SIZE = {rx:105, ry:44};
const ACTOR_X = {left:75, right:1525};

// Compact coordinates preserve the same actors, goals and dependencies.
BASE_UC.filter(u=>u.column==='left').forEach((u,i)=>{u.x=450;u.cy=300+i*118;});
BASE_UC.filter(u=>u.column==='right').forEach((u,i)=>{u.x=1150;u.cy=400+i*160;});
BASE_UC.find(u=>u.id==='login').x=800;
BASE_UC.find(u=>u.id==='login').cy=210;
SUPPORT_UC.forEach(u=>{u.x=800;u.cy=({addeq:340,updateeq:458,deleteeq:576,searcheq:694,selectres:788,recordblc:980,checkitem:1100,headinfo:1230,checkhours:1454,forecast:1568})[u.id];});
// Reserve an upper supporting-use-case row for the Head-only forecast.
BASE_UC.filter(u=>u.id!=='login').forEach(u=>u.cy+=140);
SUPPORT_UC.forEach(u=>{u.cy=u.id==='forecast'?340:u.cy+140;});
ACTORS.find(a=>a.id==='faculty').cy=950;
ACTORS.find(a=>a.id==='dean').cy=1470;
BASE_UC.forEach(u=>{if(u.column==='left')u.x=470;if(u.column==='right')u.x=1130;});
const shortLabels={
  submitcombined:['Submit Request:','On-Schedule Non-Lab','or Out-of-Schedule'],
  reschedres:['Reschedule','Laboratory','Reservation'],
  issueacct:['Manage Class Rep. /','Faculty Accounts'],
  recordblc:['Record Broken,','Lost or Consumed','Items'],
  mgmlogs:['Manage Logs,','Schedule &','Daily Tasks']
};
BASE_UC.concat(SUPPORT_UC).forEach(u=>{u.fullName=u.label.join(' ');if(shortLabels[u.id])u.label=shortLabels[u.id];});
const NS = 'http://www.w3.org/2000/svg';
const byId = {};
BASE_UC.concat(SUPPORT_UC).forEach(item => { byId[item.id] = item; });

function el(tag, attrs, children) {
  const node = document.createElementNS(NS, tag);
  Object.entries(attrs || {}).forEach(([key,value]) => node.setAttribute(key, value));
  (children || []).forEach(child => node.appendChild(child));
  return node;
}

function textEl(x, y, lines, attrs) {
  const options = Object.assign({x, y, 'text-anchor':'middle'}, attrs || {});
  const lineHeight = Number(options.lineHeight || 19);
  delete options.lineHeight;
  const text = el('text', options);
  const firstY = y - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line,index) => {
    const span = el('tspan', {x, y:firstY + index * lineHeight});
    span.textContent = line;
    text.appendChild(span);
  });
  return text;
}

function useCaseSize(useCase) {
  if (useCase.shared) return LOGIN_SIZE;
  return SUPPORT_UC.includes(useCase) ? SUPPORT_SIZE : BASE_SIZE;
}

function ellipseSidePoint(useCase, side) {
  const size = useCaseSize(useCase);
  return {
    x:useCase.x + (side === 'right' ? size.rx : -size.rx),
    y:useCase.cy
  };
}

function labelPill(layer, x, y, label, flowId, angle) {
  const group = el('g', {class:'diagram-flow-label', 'data-flow-id':flowId,transform:`rotate(${angle} ${x} ${y})`});
  const rawIndex=Number(flowId.split('-')[1]),index=rawIndex>=9?rawIndex+1:rawIndex;
  group.appendChild(textEl(x, y+(index===5?-7:index===2?7:([0,1,8,9,10,11].includes(index)?24:-7)), [`«${label}»`], {
    'font-size':index===5?18:20, fill:'#111', 'font-family':'Arial,Helvetica,sans-serif'
  }));
  layer.appendChild(group);
}

const svg = el('svg', {
  xmlns:NS, width:CANVAS_W, height:CANVAS_H,
  viewBox:`0 0 ${CANVAS_W} ${CANVAS_H}`,
  role:'img', 'aria-labelledby':'diagram-title diagram-description'
});

const title = el('title', {id:'diagram-title'});
title.textContent = 'Physics and Circuits Laboratory — Use Case Diagram';
svg.appendChild(title);
const description = el('desc', {id:'diagram-description'});
description.textContent = 'Six large actors surround a system boundary. Request and approval use cases form the left column, required and conditional supporting use cases form the center column, and laboratory management use cases form the right column.';
svg.appendChild(description);

const defs = el('defs');
const openArrow = el('marker', {
  id:'openArrow', markerWidth:12, markerHeight:12, refX:10, refY:6,
  orient:'auto', markerUnits:'userSpaceOnUse'
});
openArrow.appendChild(el('path', {
  d:'M 1 1 L 10 6 L 1 11', fill:'none', stroke:'#111',
  'stroke-width':1.5, 'stroke-linejoin':'round'
}));
defs.appendChild(openArrow);
svg.appendChild(defs);

svg.appendChild(el('rect', {x:0, y:0, width:CANVAS_W, height:CANVAS_H, fill:'#fff'}));
svg.appendChild(textEl(CANVAS_W/2, 48, ['Physics and Circuits Laboratory — Use Case Diagram'], {
  'font-size':30, fill:'#101828', 'font-weight':'700',
  'font-family':'Georgia,Times New Roman,serif'
}));
svg.appendChild(el('rect', {
  x:BOUNDARY.x, y:BOUNDARY.y, width:BOUNDARY.w, height:BOUNDARY.h,
  fill:'#fff', stroke:'#111', 'stroke-width':2
}));
svg.appendChild(textEl(CANVAS_W/2, BOUNDARY.y+40, ['A Web-Based Physics and Circuits Laboratory Management System', 'with AI Capabilities for NU Fairview'], {
  'font-size':24, fill:'#111', 'font-weight':'700', lineHeight:28,
  'font-family':'Arial,Helvetica,sans-serif'
}));

// Solid UML associations: actors stay outside the boundary and connect only
// to the base use cases in which they directly participate.
const associationLayer = el('g', {'aria-label':'Actor associations'});
svg.appendChild(associationLayer);
// Visual order differs from ACTORS array order after Faculty and Dean move.
const loginActorsBySide = Object.fromEntries(['left','right'].map(side => [side,
  ACTORS.filter(actor => actor.side===side && actor.uses.includes('login')).sort((a,b)=>a.cy-b.cy)
]));
ACTORS.forEach(actor => {
  const hand = {
    x:ACTOR_X[actor.side] + (actor.side === 'left' ? 43.5 : -43.5),
    y:actor.cy - 13.5
  };
  actor.uses.forEach(useCaseId => {
    const useCase = byId[useCaseId];
    if(useCase.diagramHidden)return;
    const endpoint = ellipseSidePoint(useCase, actor.side);
    const flowId = `association-${actor.id}-${useCaseId}`;
    const left=actor.side==='left';
    const loginRank=loginActorsBySide[actor.side].indexOf(actor);
    const i=loginRank+(left?0:loginActorsBySide.left.length);
    const outer=left?152+loginRank*14:1448-loginRank*14;
    const inner=endpoint.x+(left?-22-i*7:22+i*7),top=158+i*8;
    associationLayer.appendChild(el('path', {
      class:'diagram-connector', 'data-flow-id':flowId,
      d:`M ${hand.x} ${hand.y} L ${endpoint.x.toFixed(1)} ${endpoint.y.toFixed(1)}`,
      fill:'none', stroke:'#111', 'stroke-width':1.8
    }));
  });
});

// Dashed UML dependencies. The data records the semantic direction directly:
// include points to the required use case; extend points to the base use case.
const relationshipLayer = el('g', {'aria-label':'Include and extend relationships'});
svg.appendChild(relationshipLayer);
RELATIONSHIPS.forEach((relationship,index) => {
  const source = byId[relationship.from];
  const target = byId[relationship.to];
  const targetIsRight = target.x >= source.x;
  const sourceEdge = ellipseSidePoint(source, targetIsRight ? 'right' : 'left');
  const targetEdge = ellipseSidePoint(target, targetIsRight ? 'left' : 'right');
  const flowId = `relationship-${index}-${relationship.type}`;
  const slot=index>=9?index+1:index;
  const points=[sourceEdge,targetEdge],t=slot===0?.55:slot===12?.15:slot===5?.25:slot===11?.5:slot===2?.59:([6,10].includes(slot)?.5:(relationship.type==='include'?.65:.35));
  const lx=sourceEdge.x+(targetEdge.x-sourceEdge.x)*t,ly=sourceEdge.y+(targetEdge.y-sourceEdge.y)*t;
  let angle=Math.atan2(targetEdge.y-sourceEdge.y,targetEdge.x-sourceEdge.x)*180/Math.PI;
  if(angle>90)angle-=180;if(angle<-90)angle+=180;
  relationshipLayer.appendChild(el('path', {
    class:'diagram-connector', 'data-flow-id':flowId,
    d:points.map((p,i)=>(i?'L ':'M ')+p.x+' '+p.y).join(' '),
    fill:'none', stroke:'#111', 'stroke-width':1.8,
    'stroke-dasharray':'9 7', 'marker-end':'url(#openArrow)'
  }));
  labelPill(relationshipLayer, lx, ly, relationship.type, flowId, angle);
});

const useCaseLayer = el('g', {'aria-label':'Use cases'});
svg.appendChild(useCaseLayer);
BASE_UC.concat(SUPPORT_UC).filter(u=>!u.diagramHidden).forEach(useCase => {
  const size = useCaseSize(useCase);
  const support = SUPPORT_UC.includes(useCase);
  const group = el('g', {id:`usecase-${useCase.id}`});
  const fullTitle=el('title');fullTitle.textContent=useCase.fullName;group.appendChild(fullTitle);
  group.appendChild(el('ellipse', {
    cx:useCase.x, cy:useCase.cy, rx:size.rx, ry:size.ry,
    fill:'#fff',
    stroke:'#111', 'stroke-width':2
  }));
  group.appendChild(textEl(useCase.x, useCase.cy+5, useCase.label, {
    'font-size':support?18:20,
    fill:'#101828', 'font-weight':support ? '500' : '600',
    'font-family':'Arial,Helvetica,sans-serif', lineHeight:support?19:21
  }));
  useCaseLayer.appendChild(group);
});

function drawActor(actor) {
  const x = ACTOR_X[actor.side];
  const y = actor.cy;
  const color = '#111';
  const group = el('g', {id:`actor-${actor.id}`,transform:`translate(${x} ${y}) scale(.75) translate(${-x} ${-y})`});
  group.appendChild(el('circle', {cx:x, cy:y-76, r:24, fill:'none', stroke:color, 'stroke-width':7}));
  group.appendChild(el('line', {x1:x, y1:y-52, x2:x, y2:y+22, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(el('line', {x1:x-58, y1:y-18, x2:x+58, y2:y-18, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(el('line', {x1:x, y1:y+22, x2:x-43, y2:y+86, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(el('line', {x1:x, y1:y+22, x2:x+43, y2:y+86, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(textEl(x, y+126, actor.label, {
    'font-size':26, fill:'#111', 'font-weight':'700',
    'font-family':'Arial,Helvetica,sans-serif', lineHeight:29
  }));
  return group;
}

const actorLayer = el('g', {'aria-label':'Actors'});
ACTORS.forEach(actor => actorLayer.appendChild(drawActor(actor)));
svg.appendChild(actorLayer);

const legend = el('g', {transform:'translate(250 1765)', 'aria-label':'Relationship legend'});
legend.appendChild(el('line', {x1:0, y1:0, x2:55, y2:0, stroke:'#111', 'stroke-width':1.8, 'stroke-dasharray':'9 7', 'marker-end':'url(#openArrow)'}));
legend.appendChild(textEl(72, 5, ['«include» required shared behavior'], {
  'font-size':20, fill:'#111', 'text-anchor':'start', 'font-family':'Arial,Helvetica,sans-serif'
}));
legend.appendChild(el('line', {x1:540, y1:0, x2:595, y2:0, stroke:'#111', 'stroke-width':1.8, 'stroke-dasharray':'9 7', 'marker-end':'url(#openArrow)'}));
legend.appendChild(textEl(612, 5, ['«extend» condition-dependent behavior'], {
  'font-size':20, fill:'#111', 'text-anchor':'start', 'font-family':'Arial,Helvetica,sans-serif'
}));
svg.appendChild(legend);

document.getElementById('stage').appendChild(svg);
// Mask only a dependency's own dashed stroke behind its plain label.
// Other associations remain visible; no white label box covers the diagram.
document.querySelectorAll('.diagram-flow-label').forEach((label,i)=>{
  const mask=el('mask',{id:'dependency-gap-'+i,maskUnits:'userSpaceOnUse',x:0,y:0,width:CANVAS_W,height:CANVAS_H});
  mask.appendChild(el('rect',{x:0,y:0,width:CANVAS_W,height:CANVAS_H,fill:'#fff'}));
  const gap=el('rect',{fill:'#000'});mask.appendChild(gap);defs.appendChild(mask);
  const path=svg.querySelector('.diagram-connector[data-flow-id="'+label.dataset.flowId+'"]');
  path.setAttribute('mask','url(#dependency-gap-'+i+')');
  const update=()=>{
    const b=label.getBBox();Object.entries({x:b.x-3,y:b.y-2,width:b.width+6,height:b.height+4}).forEach(([k,v])=>gap.setAttribute(k,v));
    const transform=label.getAttribute('transform');if(transform)gap.setAttribute('transform',transform);else gap.removeAttribute('transform');
  };update();
  if(!outputMode)new MutationObserver(update).observe(label,{attributes:true,attributeFilter:['transform']});
});
if(!outputMode){
  const authored=svg.cloneNode(true);
  window.SOMADADiagramEditor.init(svg, {storageKey:'usecase-guidance-compact-v6'});
  window.addEventListener('beforeprint',()=>svg.replaceWith(authored));
  window.addEventListener('afterprint',()=>authored.replaceWith(svg));
}
window.__done = true;
</script>
