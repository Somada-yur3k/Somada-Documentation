<nav class="page-tabs somada-nav" aria-label="Primary navigation">

<div id="stage"></div>
<script>
/*
 * Three-column layout based on the project's Use Case Guide:
 *   left   = requester and approver processes
 *   center = included and extended supporting use cases
 *   right  = laboratory management processes
 * Actors remain outside the SOMADA system boundary. Dashboard-only entries
 * are intentionally excluded so the diagram emphasizes business processes.
 */
if (new URLSearchParams(location.search).has('export')) {
  document.body.classList.add('export-mode');
}

const ACTORS = [
  {
    id:'classrep', label:['Class','Representative'], color:'#2454a6', side:'left', cy:430,
    uses:['login','chooselab','viewsched','submitres','cancelres','reschedres','viewstatus','viewhistory','clearstatus','askq']
  },
  {
    id:'dean', label:['Dean'], color:'#7b68a6', side:'left', cy:950,
    uses:['login','chooselab','viewsched','submitres','viewstatus','approve']
  },
  {
    id:'faculty', label:['Faculty'], color:'#e08a00', side:'left', cy:1470,
    uses:['login','chooselab','viewsched','submitres','cancelres','reschedres','viewstatus','viewhistory','clearstatus','approve','askq']
  },
  {
    id:'headlab', label:['Head','Laboratory'], color:'#2f7d1b', side:'right', cy:430,
    uses:['login','issueacct','mgminv','issueeq','procret','procclear','wastedisp','mgmlogs','endterm']
  },
  {
    id:'physics', label:['Physics Laboratory','Staff'], color:'#707782', side:'right', cy:950,
    uses:['login','mgminv','issueeq','procret','procclear','wastedisp','mgmlogs']
  },
  {
    id:'circuits', label:['Circuits Laboratory','Staff'], color:'#182ed4', side:'right', cy:1470,
    uses:['login','mgminv','issueeq','procret','procclear','wastedisp','mgmlogs']
  }
];

const BASE_UC = [
  {id:'login',       x:1300, cy:205,  label:['Log In'], shared:true},

  {id:'chooselab',   x:860,  cy:340,  label:['Choose Laboratory'], column:'left'},
  {id:'viewsched',   x:860,  cy:490,  label:['View Schedule &','Availability'], column:'left'},
  {id:'submitres',   x:860,  cy:640,  label:['Submit Laboratory','Reservation'], column:'left'},
  {id:'cancelres',   x:860,  cy:790,  label:['Cancel Laboratory','Reservation'], column:'left'},
  {id:'reschedres',  x:860,  cy:940,  label:['Reschedule Laboratory','Reservation'], column:'left'},
  {id:'viewstatus',  x:860,  cy:1090, label:['View Reservation','Status'], column:'left'},
  {id:'viewhistory', x:860,  cy:1240, label:['View Reservation','History'], column:'left'},
  {id:'clearstatus', x:860,  cy:1390, label:['View Clearance','Status'], column:'left'},
  {id:'approve',     x:860,  cy:1540, label:['Approve / Reject','Reservation'], column:'left'},
  {id:'askq',        x:860,  cy:1690, label:['Ask Laboratory','Question'], column:'left'},

  {id:'issueacct',   x:1740, cy:390,  label:['Issue Class','Representative Account'], column:'right'},
  {id:'mgminv',      x:1740, cy:570,  label:['Manage Equipment','Inventory'], column:'right'},
  {id:'issueeq',     x:1740, cy:750,  label:['Issue Equipment'], column:'right'},
  {id:'procret',     x:1740, cy:930,  label:['Process Return'], column:'right'},
  {id:'procclear',   x:1740, cy:1110, label:['Process Clearance'], column:'right'},
  {id:'wastedisp',   x:1740, cy:1290, label:['Log Waste','Disposal'], column:'right'},
  {id:'mgmlogs',     x:1740, cy:1470, label:['Manage Logs, Schedule','& Daily Tasks'], column:'right'},
  {id:'endterm',     x:1740, cy:1650, label:['Generate End-Term','Report'], column:'right'}
];

const SUPPORT_UC = [
  {id:'addeq',       x:1300, cy:315,  label:['Add Equipment']},
  {id:'updateeq',    x:1300, cy:405,  label:['Update Equipment']},
  {id:'deleteeq',    x:1300, cy:495,  label:['Remove Equipment']},
  {id:'searcheq',    x:1300, cy:585,  label:['Search & Filter','Inventory']},
  {id:'selectres',   x:1300, cy:685,  label:['Select Resources /','Equipment']},
  {id:'recordblc',   x:1300, cy:900,  label:['Record Broken / Lost','/ Consumed Items']},
  {id:'markclear',   x:1300, cy:1110, label:['Mark Clearance as','Cleared / Replaced']},
  {id:'checkitem',   x:1300, cy:1325, label:['Check Item','Availability']},
  {id:'checksched',  x:1300, cy:1420, label:['Check Schedule','Availability']},
  {id:'checkstatus', x:1300, cy:1515, label:['Check Reservation','Status']},
  {id:'checkhours',  x:1300, cy:1610, label:['Check Operating','Hours']}
];

const RELATIONSHIPS = [
  {from:'mgminv',      to:'addeq',       type:'include'},
  {from:'mgminv',      to:'updateeq',    type:'include'},
  {from:'mgminv',      to:'deleteeq',    type:'include'},
  {from:'searcheq',    to:'mgminv',      type:'extend'},
  {from:'selectres',   to:'submitres',   type:'extend'},
  {from:'procret',     to:'recordblc',   type:'include'},
  {from:'procclear',   to:'recordblc',   type:'include'},
  {from:'procclear',   to:'markclear',   type:'include'},
  {from:'checkitem',   to:'askq',        type:'extend'},
  {from:'checksched',  to:'askq',        type:'extend'},
  {from:'checkstatus', to:'askq',        type:'extend'},
  {from:'checkhours',  to:'askq',        type:'extend'}
];

const CANVAS_W = 2600;
const CANVAS_H = 1900;
const BOUNDARY = {x:630, y:105, w:1340, h:1680};
const BASE_SIZE = {rx:150, ry:42};
const LOGIN_SIZE = {rx:170, ry:48};
const SUPPORT_SIZE = {rx:130, ry:31};
const ACTOR_X = {left:170, right:2430};

const NS = 'http://www.w3.org/2000/svg';
const byId = {};
BASE_UC.concat(SUPPORT_UC).forEach(item => { byId[item.id] = item; });

function el(tag, attrs, children) {
  const node = document.createElementNS(NS, tag);
  Object.entries(attrs || {}).forEach(([key,value]) => node.setAttribute(key, value));
  (children || []).forEach(child => node.appendChild(child));
  return node;
}

function textEl(x, y, lines, attrs) {
  const options = Object.assign({x, y, 'text-anchor':'middle'}, attrs || {});
  const lineHeight = Number(options.lineHeight || 19);
  delete options.lineHeight;
  const text = el('text', options);
  const firstY = y - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line,index) => {
    const span = el('tspan', {x, y:firstY + index * lineHeight});
    span.textContent = line;
    text.appendChild(span);
  });
  return text;
}

function useCaseSize(useCase) {
  if (useCase.shared) return LOGIN_SIZE;
  return SUPPORT_UC.includes(useCase) ? SUPPORT_SIZE : BASE_SIZE;
}

function ellipseBoundaryPoint(useCase, externalPoint) {
  const size = useCaseSize(useCase);
  const dx = externalPoint.x - useCase.x;
  const dy = externalPoint.y - useCase.cy;
  const scale = 1 / Math.sqrt((dx * dx) / (size.rx * size.rx) + (dy * dy) / (size.ry * size.ry));
  return {x:useCase.x + dx * scale, y:useCase.cy + dy * scale};
}

function labelPill(layer, x, y, label, flowId) {
  const width = Math.max(76, 22 + label.length * 7.2);
  const group = el('g', {class:'diagram-flow-label', 'data-flow-id':flowId});
  group.appendChild(el('rect', {
    x:x-width/2, y:y-14, width, height:28, rx:14,
    fill:'#ffffff', stroke:'#98a2b3', 'stroke-width':1
  }));
  group.appendChild(textEl(x, y+4, [`«${label}»`], {
    'font-size':14, fill:'#344054', 'font-weight':'700',
    'font-family':'Arial,Helvetica,sans-serif'
  }));
  layer.appendChild(group);
}

const svg = el('svg', {
  xmlns:NS, width:CANVAS_W, height:CANVAS_H,
  viewBox:`0 0 ${CANVAS_W} ${CANVAS_H}`,
  role:'img', 'aria-labelledby':'diagram-title diagram-description'
});

const title = el('title', {id:'diagram-title'});
title.textContent = 'SOMADA Use Case Diagram';
svg.appendChild(title);
const description = el('desc', {id:'diagram-description'});
description.textContent = 'Six large actors surround a system boundary. Request and approval use cases form the left column, include and extend use cases form the center column, and laboratory management use cases form the right column.';
svg.appendChild(description);

const defs = el('defs');
const openArrow = el('marker', {
  id:'openArrow', markerWidth:12, markerHeight:12, refX:10, refY:6,
  orient:'auto', markerUnits:'userSpaceOnUse'
});
openArrow.appendChild(el('path', {
  d:'M 1 1 L 10 6 L 1 11', fill:'#ffffff', stroke:'#667085',
  'stroke-width':1.5, 'stroke-linejoin':'round'
}));
defs.appendChild(openArrow);
svg.appendChild(defs);

svg.appendChild(el('rect', {x:0, y:0, width:CANVAS_W, height:CANVAS_H, fill:'#f8fafc'}));
svg.appendChild(textEl(CANVAS_W/2, 48, ['SOMADA Use Case Diagram'], {
  'font-size':30, fill:'#101828', 'font-weight':'700',
  'font-family':'Georgia,Times New Roman,serif'
}));
svg.appendChild(el('rect', {
  x:BOUNDARY.x, y:BOUNDARY.y, width:BOUNDARY.w, height:BOUNDARY.h,
  fill:'#e9eef5', stroke:'#9fb0c5', 'stroke-width':2
}));
svg.appendChild(textEl(BOUNDARY.x+18, BOUNDARY.y+26, ['SOMADA – Laboratory Reservation and Management System'], {
  'font-size':14, fill:'#344054', 'font-weight':'700', 'text-anchor':'start',
  'font-family':'Arial,Helvetica,sans-serif'
}));

// Solid UML associations: actors stay outside the boundary and connect only
// to the base use cases in which they directly participate.
const associationLayer = el('g', {'aria-label':'Actor associations'});
svg.appendChild(associationLayer);
ACTORS.forEach(actor => {
  const hand = {
    x:ACTOR_X[actor.side] + (actor.side === 'left' ? 58 : -58),
    y:actor.cy - 17
  };
  actor.uses.forEach(useCaseId => {
    const useCase = byId[useCaseId];
    const endpoint = ellipseBoundaryPoint(useCase, hand);
    const flowId = `association-${actor.id}-${useCaseId}`;
    associationLayer.appendChild(el('path', {
      class:'diagram-connector', 'data-flow-id':flowId,
      d:`M ${hand.x} ${hand.y} L ${endpoint.x.toFixed(1)} ${endpoint.y.toFixed(1)}`,
      fill:'none', stroke:'#667085', 'stroke-width':1.45, opacity:.86
    }));
  });
});

// Dashed UML dependencies. The data records the semantic direction directly:
// include points to the required use case; extend points to the base use case.
const relationshipLayer = el('g', {'aria-label':'Include and extend relationships'});
svg.appendChild(relationshipLayer);
RELATIONSHIPS.forEach((relationship,index) => {
  const source = byId[relationship.from];
  const target = byId[relationship.to];
  const sourceEdge = ellipseBoundaryPoint(source, {x:target.x, y:target.cy});
  const targetEdge = ellipseBoundaryPoint(target, {x:source.x, y:source.cy});
  const flowId = `relationship-${index}-${relationship.type}`;
  relationshipLayer.appendChild(el('path', {
    class:'diagram-connector', 'data-flow-id':flowId,
    d:`M ${sourceEdge.x.toFixed(1)} ${sourceEdge.y.toFixed(1)} L ${targetEdge.x.toFixed(1)} ${targetEdge.y.toFixed(1)}`,
    fill:'none', stroke:'#667085', 'stroke-width':1.6,
    'stroke-dasharray':'9 7', 'marker-end':'url(#openArrow)'
  }));
  const lx = sourceEdge.x + (targetEdge.x-sourceEdge.x)*.5;
  const ly = sourceEdge.y + (targetEdge.y-sourceEdge.y)*.5;
  labelPill(relationshipLayer, lx, ly, relationship.type, flowId);
});

const useCaseLayer = el('g', {'aria-label':'Use cases'});
svg.appendChild(useCaseLayer);
BASE_UC.concat(SUPPORT_UC).forEach(useCase => {
  const size = useCaseSize(useCase);
  const support = SUPPORT_UC.includes(useCase);
  const group = el('g', {id:`usecase-${useCase.id}`});
  group.appendChild(el('ellipse', {
    cx:useCase.x, cy:useCase.cy, rx:size.rx, ry:size.ry,
    fill:support ? '#dcecf8' : '#cde7f8',
    stroke:'#1ea7e8', 'stroke-width':2
  }));
  group.appendChild(textEl(useCase.x, useCase.cy+5, useCase.label, {
    'font-size':support ? 14 : 16,
    fill:'#101828', 'font-weight':support ? '500' : '600',
    'font-family':'Arial,Helvetica,sans-serif', lineHeight:support ? 17 : 19
  }));
  useCaseLayer.appendChild(group);
});

function drawActor(actor) {
  const x = ACTOR_X[actor.side];
  const y = actor.cy;
  const color = actor.color;
  const group = el('g', {id:`actor-${actor.id}`});
  group.appendChild(el('circle', {cx:x, cy:y-76, r:24, fill:'none', stroke:color, 'stroke-width':7}));
  group.appendChild(el('line', {x1:x, y1:y-52, x2:x, y2:y+22, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(el('line', {x1:x-58, y1:y-18, x2:x+58, y2:y-18, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(el('line', {x1:x, y1:y+22, x2:x-43, y2:y+86, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(el('line', {x1:x, y1:y+22, x2:x+43, y2:y+86, stroke:color, 'stroke-width':7, 'stroke-linecap':'round'}));
  group.appendChild(textEl(x, y+126, actor.label, {
    'font-size':19, fill:'#101828', 'font-weight':'700',
    'font-family':'Arial,Helvetica,sans-serif', lineHeight:22
  }));
  return group;
}

const actorLayer = el('g', {'aria-label':'Actors'});
ACTORS.forEach(actor => actorLayer.appendChild(drawActor(actor)));
svg.appendChild(actorLayer);

const legend = el('g', {transform:'translate(760 1840)', 'aria-label':'Relationship legend'});
legend.appendChild(el('line', {x1:0, y1:0, x2:55, y2:0, stroke:'#667085', 'stroke-width':1.6, 'stroke-dasharray':'9 7', 'marker-end':'url(#openArrow)'}));
legend.appendChild(textEl(72, 5, ['«include» required supporting behavior'], {
  'font-size':14, fill:'#475467', 'text-anchor':'start', 'font-family':'Arial,Helvetica,sans-serif'
}));
legend.appendChild(el('line', {x1:460, y1:0, x2:515, y2:0, stroke:'#667085', 'stroke-width':1.6, 'stroke-dasharray':'9 7', 'marker-end':'url(#openArrow)'}));
legend.appendChild(textEl(532, 5, ['«extend» conditional supporting behavior'], {
  'font-size':14, fill:'#475467', 'text-anchor':'start', 'font-family':'Arial,Helvetica,sans-serif'
}));
svg.appendChild(legend);

document.getElementById('stage').appendChild(svg);
window.SOMADADiagramEditor.init(svg, {storageKey:'usecase-diagram-three-column-v1'});
window.__done = true;
</script>
