const params=new URLSearchParams(location.search);if(params.has('export'))document.body.classList.add('export-mode');if(params.has('embed'))document.body.classList.add('embed-mode');const showGrid=params.get('grid')==='1'&&!params.has('export');

{id:'classrep',name:['Class Representative'],y:260,c:'#2563eb'},
{id:'faculty',name:['Faculty'],y:810,c:'#c24152'},
{id:'dean',name:['Dean'],y:1360,c:'#be3b91'},
{id:'headlab',name:['Head Laboratory'],y:2380,c:'#1f9d55'},
{id:'physics',name:['Physics Laboratory Staff'],y:2930,c:'#d97706'},
{id:'circuits',name:['Circuits Laboratory Staff'],y:3480,c:'#0f9b99'}];

{id:'d4',n:'D4',name:['Equipment Inventory'],y:2170},
{id:'d5',n:'D5',name:['Borrowing Slip Records'],y:2440},

const byE=Object.fromEntries(entities.map(v=>[v.id,v])),byP=Object.fromEntries(processes.map(v=>[v.id,v])),byD=Object.fromEntries(stores.map(v=>[v.id,v]));
const spread=(count,start,end)=>count===1?[(start+end)/2]:Array.from({length:count},(_,i)=>start+(end-start)*i/(count-1));
function el(tag,a={},kids=[]){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));kids.forEach(k=>n.appendChild(k));return n}
function tx(x,y,lines,a={}){const t=el('text',{x,'text-anchor':'middle',...a}),lh=a.lineHeight||16,top=y-(lines.length-1)*lh/2;lines.forEach((s,i)=>{const q=el('tspan',{x,y:top+i*lh});q.textContent=s;t.appendChild(q)});return t}
function marker(id,color){const m=el('marker',{id,markerWidth:9,markerHeight:9,refX:7.5,refY:3.5,orient:'auto',markerUnits:'userSpaceOnUse'});m.appendChild(el('path',{d:'M0,0 L8,3.5 L0,7 Z',fill:color}));return m}
const svg=el('svg',{xmlns:NS,width:W,height:H,viewBox:`0 0 ${W} ${H}`}),defs=el('defs');entities.forEach(a=>defs.appendChild(marker('a-'+a.id,a.c)));defs.appendChild(marker('a-system',C.gray));svg.appendChild(defs);svg.appendChild(el('rect',{width:W,height:H,fill:'#fff'}));
svg.appendChild(tx(W/2,52,['SOMADA - Data Flow Diagram (Level 1)'],{'font-size':30,fill:C.ink,'font-weight':'700','font-family':'Georgia,serif'}));svg.appendChild(tx(W/2,84,['Five equal-sized processes; six aligned entities; ten unique data stores'],{'font-size':13,fill:C.gray}));
const guideLayer=el('g'),flowLayer=el('g'),boxLayer=el('g'),labelLayer=el('g');svg.appendChild(guideLayer);svg.appendChild(flowLayer);svg.appendChild(boxLayer);svg.appendChild(labelLayer);let seq=0;
function drawPath(points,color,markerId,flowId=''){const id=flowId||`level1-flow-${++seq}`,d=points.map((p,i)=>(i?'L':'M')+' '+p[0]+' '+p[1]).join(' ');flowLayer.appendChild(el('path',{class:'diagram-connector-halo','data-flow-id':id,d,fill:'none',stroke:'#fff','stroke-width':7,'stroke-linejoin':'round','stroke-linecap':'round'}));flowLayer.appendChild(el('path',{class:'diagram-connector','data-flow-id':id,d,fill:'none',stroke:color,'stroke-width':1.8,'stroke-linejoin':'round','stroke-linecap':'round','marker-end':`url(#${markerId})`}));return id}
function drawLabel(x,y,text,flowId,orientation='h'){const w=Math.max(24,text.length*6.1+7),h=20,g=el('g',{class:'diagram-flow-label','data-flow-id':flowId,...(orientation==='v'?{transform:`rotate(90 ${x} ${y})`}:{})});g.appendChild(el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:5,fill:'#fff',stroke:'#dfe3ea','stroke-width':.8}));g.appendChild(tx(x,y+3.5,[text],{'font-size':11.5,fill:C.ink,'font-weight':'650'}));labelLayer.appendChild(g)}
function arrow(points,text,color,markerId,lx,ly,orientation='h',flowId=''){const id=drawPath(points,color,markerId,flowId);drawLabel(lx,ly,text,id,orientation);return id}

const externalGroups={

p2:[{entity:'classrep',flows:[F('p2-cr-onschedule','in','On-Schedule Non-Laboratory Request'),F('p2-cr-outschedule','in','Out-of-Schedule Request'),F('p2-cr-change','in','Reservation Change Request'),F('p2-cr-availability','out','Schedule & Availability'),F('p2-cr-status','out','Reservation Status'),F('p2-cr-history','out','Reservation History')]},{entity:'faculty',flows:[F('p2-fa-scheduled','in','Scheduled Laboratory Activity'),F('p2-fa-outschedule','in','Out-of-Schedule Request'),F('p2-fa-change','in','Reservation Change Request'),F('p2-fa-decision','in','Approval Decision'),F('p2-fa-availability','out','Schedule & Availability'),F('p2-fa-routed','out','Routed Approval Request'),F('p2-fa-status','out','Reservation Status'),F('p2-fa-history','out','Reservation History')]},{entity:'dean',flows:[F('p2-de-decision','in','Approval Decision'),F('p2-de-routed','out','Routed Approval Request')]}],
p3:[{entity:'classrep',flows:[F('p3-cr-inquiry','in','Inquiry'),F('p3-cr-answer','out','Answer')]},{entity:'faculty',flows:[F('p3-fa-inquiry','in','Inquiry'),F('p3-fa-answer','out','Answer')]}],

p5:[{entity:'classrep',flows:[F('p5-cr-clearance','out','Clearance Status')]},{entity:'headlab',flows:[F('p5-he-schedule','in','Schedule Update'),F('p5-he-usage','in','Usage Entry'),F('p5-he-task','in','Daily Task Entry'),F('p5-he-clearance','in','Clearance Action'),F('p5-he-reportrequest','in','Report Request'),F('p5-he-dashboard','out','Laboratory Dashboard'),F('p5-he-report','out','End-Term Report')]},{entity:'physics',flows:[F('p5-ph-usage','in','Usage Entry'),F('p5-ph-task','in','Daily Task Entry'),F('p5-ph-dashboard','out','Laboratory Dashboard')]},{entity:'circuits',flows:[F('p5-ci-usage','in','Usage Entry'),F('p5-ci-task','in','Daily Task Entry'),F('p5-ci-dashboard','out','Laboratory Dashboard')]}]};
/* Entity right-side ports run top-to-bottom from the shortest estimated route
   to the longest route. Within an entity, shorter routes use the outer lane. */
const entityFlowMeta={};entities.forEach(e=>entityFlowMeta[e.id]=[]);Object.entries(externalGroups).forEach(([pid,groups])=>groups.forEach(g=>g.flows.forEach((f,order)=>entityFlowMeta[g.entity].push({key:f.key,pid,order}))));const entityFlowKeys={};entities.forEach(e=>{const entityCenter=e.y+E.h/2;entityFlowKeys[e.id]=entityFlowMeta[e.id].sort((a,b)=>{const da=Math.abs(entityCenter-(byP[a.pid].y+P.h/2));const db=Math.abs(entityCenter-(byP[b.pid].y+P.h/2));return da-db||a.pid.localeCompare(b.pid)||a.order-b.order}).map(f=>f.key)});const entityPort={};entities.forEach(e=>spread(entityFlowKeys[e.id].length,e.y+18,e.y+E.h-18).forEach((y,i)=>entityPort[entityFlowKeys[e.id][i]]=y));const entityLane={};let entityLaneSeq=0;entities.forEach(e=>{const keys=entityFlowKeys[e.id];keys.forEach((key,index)=>entityLane[key]=550+(entityLaneSeq+keys.length-1-index)*16);entityLaneSeq+=keys.length});
function guideBand(owner,top,bottom,side,color){if(!showGrid)return;const x=side==='left'?E.x+E.w+8:P.x+P.w,width=side==='left'?P.x-x:D.x-(P.x+P.w);guideLayer.appendChild(el('rect',{x,y:top,width,height:bottom-top,fill:color,'fill-opacity':.035,stroke:color,'stroke-opacity':.55,'stroke-width':1.2,'stroke-dasharray':'9 7'}));guideLayer.appendChild(tx(side==='left'?x+8:x+width-8,top+15,[owner],{'font-size':10,fill:color,'font-weight':'700','text-anchor':side==='left'?'start':'end'}))}
function routeExternalBands(pid,groups){const p=byP[pid],usableTop=p.y+57,usableBottom=p.y+P.h-25,bandH=(usableBottom-usableTop)/groups.length;groups.forEach((g,gi)=>{const e=byE[g.entity],top=usableTop+gi*bandH,bottom=top+bandH,ports=spread(g.flows.length,top+14,bottom-14);guideBand(g.entity,top,bottom,'left',e.c);g.flows.forEach((f,fi)=>{const sy=entityPort[f.key],py=ports[fi],lane=entityLane[f.key],from=[E.x+E.w,sy],to=[P.x,py],geometry=[from,[lane,sy],[lane,py],to],points=f.dir==='in'?geometry:[...geometry].reverse(),leftSpan=Math.abs(lane-(E.x+E.w)),rightSpan=P.x-lane,lx=leftSpan>rightSpan?(E.x+E.w+lane)/2:(lane+P.x)/2,ly=leftSpan>rightSpan?sy:py;arrow(points,f.label,e.c,'a-'+g.entity,lx,ly,'h',f.key)})})}Object.entries(externalGroups).forEach(([pid,groups])=>routeExternalBands(pid,groups));
const storeGroups={
p1:[{store:'d1',flows:[F('p1-d1-write','write','Account Record'),F('p1-d1-read','read','Account Data')]}],
p2:[{store:'d2',flows:[F('p2-d2-write','write','Reservation / Approval Record'),F('p2-d2-read','read','Reservation / Approval Data')]},{store:'d3',flows:[F('p2-d3-read','read','Schedule Data')]},{store:'d4',flows:[F('p2-d4-read','read','Item Availability Data')]}],
p3:[{store:'d8',flows:[F('p3-d8-read','read','Knowledge Content')]},{store:'d9',flows:[F('p3-d9-write','write','Question / Answer Log')]},{store:'d2',flows:[F('p3-d2-read','read','Reservation Status Data')]},{store:'d3',flows:[F('p3-d3-read','read','Schedule Availability Data')]},{store:'d4',flows:[F('p3-d4-read','read','Item Availability Data')]}],
p4:[{store:'d2',flows:[F('p4-d2-read','read','Authorized Reservation Data'),F('p4-d2-write','write','Reservation Status Update')]},{store:'d4',flows:[F('p4-d4-write','write','Inventory Transaction'),F('p4-d4-read','read','Available Item Data')]},{store:'d5',flows:[F('p4-d5-write','write','Borrowing Slip Record'),F('p4-d5-read','read','Borrowing Slip Data')]},{store:'d10',flows:[F('p4-d10-write','write','Disposal Record')]}],
p5:[{store:'d2',flows:[F('p5-d2-read','read','Reservation Summary')]},{store:'d3',flows:[F('p5-d3-write','write','Schedule / Usage Record'),F('p5-d3-read','read','Schedule / Usage Data')]},{store:'d4',flows:[F('p5-d4-read','read','Inventory Summary')]},{store:'d5',flows:[F('p5-d5-read','read','Borrowing Summary')]},{store:'d6',flows:[F('p5-d6-write','write','Clearance Record'),F('p5-d6-read','read','Clearance Data')]},{store:'d7',flows:[F('p5-d7-write','write','Daily Task Record'),F('p5-d7-read','read','Daily Task Data')]},{store:'d10',flows:[F('p5-d10-read','read','Disposal Summary')]}]};
const storeFlowKeys={};stores.forEach(s=>storeFlowKeys[s.id]=[]);Object.values(storeGroups).flat().forEach(g=>g.flows.forEach(f=>storeFlowKeys[g.store].push(f.key)));const storePort={};stores.forEach(s=>spread(storeFlowKeys[s.id].length,s.y+13,s.y+D.h-13).forEach((y,i)=>storePort[storeFlowKeys[s.id][i]]=y));const storeLane={};let storeLaneSeq=0;stores.forEach(s=>storeFlowKeys[s.id].forEach(key=>storeLane[key]=2225+(storeLaneSeq++)*15.5));
function routeStoreBands(pid,groups){const p=byP[pid],usableTop=p.y+57,usableBottom=p.y+P.h-25,bandH=(usableBottom-usableTop)/groups.length;groups.forEach((g,gi)=>{const s=byD[g.store],top=usableTop+gi*bandH,bottom=top+bandH,ports=spread(g.flows.length,top+14,bottom-14);guideBand(g.store,top,bottom,'right',C.store);g.flows.forEach((f,fi)=>{const py=ports[fi],sy=storePort[f.key],lane=storeLane[f.key],from=[P.x+P.w,py],to=[D.x,sy],geometry=[from,[lane,py],[lane,sy],to],points=f.dir==='write'?geometry:[...geometry].reverse(),leftSpan=lane-(P.x+P.w),rightSpan=D.x-lane,lx=leftSpan>rightSpan?(P.x+P.w+lane)/2:(lane+D.x)/2,ly=leftSpan>rightSpan?py:sy;arrow(points,f.label,C.gray,'a-system',lx,ly,'h',f.key)})})}Object.entries(storeGroups).forEach(([pid,groups])=>routeStoreBands(pid,groups));
function entityBox(a){boxLayer.appendChild(el('rect',{x:E.x,y:a.y,width:E.w,height:E.h,rx:10,fill:'#f8fbff',stroke:a.c,'stroke-width':2}));boxLayer.appendChild(tx(E.x+E.w/2,a.y+E.h/2,a.name,{'font-size':16,fill:C.ink,'font-weight':'700',lineHeight:20}))}
