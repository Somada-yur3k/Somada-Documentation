const params=new URLSearchParams(location.search);if(params.has('export'))document.body.classList.add('export-mode');if(params.has('embed'))document.body.classList.add('embed-mode');const showGrid=params.get('grid')==='1'&&!params.has('export');
/* Guided companion view. It retains the five-process model, one symbol per actor/store,

const W=4500,H=4100,NS='http://www.w3.org/2000/svg';
const C={ink:'#172033',blue:'#2563eb',gray:'#65748a',store:'#4d80d1',muted:'#94a3b8'};

const entities=[
 {id:'classrep',name:['Class Representative'],y:760,c:'#2563eb'}, {id:'faculty',name:['Faculty'],y:1080,c:'#c24152'}, {id:'dean',name:['Dean'],y:1400,c:'#be3b91'},
 {id:'headlab',name:['Head Laboratory'],y:2380,c:'#1f9d55'}, {id:'physics',name:['Physics Laboratory Staff'],y:2700,c:'#d97706'}, {id:'circuits',name:['Circuits Laboratory Staff'],y:3020,c:'#0f9b99'}];

 {id:'p3',n:'3.0',name:['Answer Laboratory','Questions'],y:1500}, {id:'p4',n:'4.0',name:['Manage Equipment','& Borrowing'],y:2160},
 {id:'p5',n:'5.0',name:['Manage Laboratory','Administration & Reporting'],y:2820}];
const stores=[

 {id:'d9',n:'D9',name:['Chat Interaction History'],y:1650}, {id:'d4',n:'D4',name:['Equipment Inventory'],y:2100}, {id:'d5',n:'D5',name:['Borrowing Slip Records'],y:2310},
 {id:'d10',n:'D10',name:['Disposal Records'],y:2520}, {id:'d3',n:'D3',name:['Laboratory Schedule & Usage Logs'],y:2830}, {id:'d7',n:'D7',name:['Daily Task Records'],y:3010}, {id:'d6',n:'D6',name:['Clearance Records'],y:3190}];
const byE=Object.fromEntries(entities.map(v=>[v.id,v])),byP=Object.fromEntries(processes.map(v=>[v.id,v])),byD=Object.fromEntries(stores.map(v=>[v.id,v]));
const spread=(count,start,end)=>count===1?[(start+end)/2]:Array.from({length:count},(_,i)=>start+(end-start)*i/(count-1));
function el(tag,a={},kids=[]){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));kids.forEach(k=>n.appendChild(k));return n}
function tx(x,y,lines,a={}){const t=el('text',{x,'text-anchor':'middle',...a}),lh=a.lineHeight||16,top=y-(lines.length-1)*lh/2;lines.forEach((s,i)=>{const q=el('tspan',{x,y:top+i*lh});q.textContent=s;t.appendChild(q)});return t}
function marker(id,color){const m=el('marker',{id,markerWidth:10,markerHeight:10,refX:8.5,refY:4,orient:'auto',markerUnits:'userSpaceOnUse'});m.appendChild(el('path',{d:'M0,0 L9,4 L0,8 Z',fill:color}));return m}
const svg=el('svg',{xmlns:NS,width:W,height:H,viewBox:`0 0 ${W} ${H}`}),defs=el('defs');entities.forEach(a=>defs.appendChild(marker('a-'+a.id,a.c)));defs.appendChild(marker('a-system',C.gray));svg.appendChild(defs);svg.appendChild(el('rect',{width:W,height:H,fill:'#fff'}));
svg.appendChild(tx(W/2,52,['SOMADA — Data Flow Diagram (Level 1): Traceable Flow View'],{'font-size':31,fill:C.ink,'font-weight':'700','font-family':'Georgia,serif'}));
svg.appendChild(tx(W/2,86,['Guided companion view • five equal-sized processes • six unique external entities • ten unique data stores'],{'font-size':14,fill:C.gray}));
svg.appendChild(tx(E.x+E.w/2,132,['EXTERNAL ENTITIES'],{'font-size':13,fill:C.muted,'font-weight':'700'}));svg.appendChild(tx(P.x+P.w/2,132,['SOMADA PROCESSES'],{'font-size':13,fill:C.muted,'font-weight':'700'}));svg.appendChild(tx(D.x+D.w/2,132,['PERSISTENT DATA STORES'],{'font-size':13,fill:C.muted,'font-weight':'700'}));
const guideLayer=el('g'),flowLayer=el('g'),boxLayer=el('g'),labelLayer=el('g');svg.appendChild(guideLayer);svg.appendChild(flowLayer);svg.appendChild(boxLayer);svg.appendChild(labelLayer);let seq=0;
function drawPath(points,color,markerId,pid,flowId=''){const id=flowId||`traceable-flow-${++seq}`,d=points.map((p,i)=>(i?'L':'M')+' '+p[0]+' '+p[1]).join(' ');for(const [cls,attrs] of [['diagram-connector-halo',{stroke:'#fff','stroke-width':8}],['diagram-connector',{stroke:color,'stroke-width':2.1,'marker-end':`url(#${markerId})`}]])flowLayer.appendChild(el('path',{class:cls,'data-flow-id':id,'data-process':pid,d,fill:'none','stroke-linejoin':'round','stroke-linecap':'round',...attrs}));return id}
function drawLabel(x,y,text,flowId,pid,orientation='h'){const w=Math.max(26,text.length*6.7+8),h=22,g=el('g',{class:'diagram-flow-label','data-flow-id':flowId,'data-process':pid,...(orientation==='v'?{transform:`rotate(90 ${x} ${y})`}:{})});g.appendChild(el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:5,fill:'#fff',stroke:'#d8e0ea','stroke-width':.9}));g.appendChild(tx(x,y+4,[text],{'font-size':12.3,fill:C.ink,'font-weight':'650'}));labelLayer.appendChild(g)}

const F=(key,dir,label)=>({key,dir,label});
/* Related boundary records are grouped only in this guided version. The Compact Detail
   version preserves the one-arrow-per-parent-flow rendering. */
const externalGroups={
 p1:[{entity:'classrep',flows:[F('p1-cr-credentials','in','Credentials')]},{entity:'faculty',flows:[F('p1-fa-credentials','in','Credentials'),F('p1-fa-crcredentials','out','Class Representative Credentials')]},{entity:'dean',flows:[F('p1-de-credentials','in','Credentials')]},{entity:'headlab',flows:[F('p1-he-credentials','in','Credentials'),F('p1-he-account','in','Class Representative Account Details')]},{entity:'physics',flows:[F('p1-ph-credentials','in','Credentials')]},{entity:'circuits',flows:[F('p1-ci-credentials','in','Credentials')]}],
 p2:[{entity:'classrep',flows:[F('p2-cr-request','in','Reservation / Change Data'),F('p2-cr-information','out','Reservation Information')]},{entity:'faculty',flows:[F('p2-fa-request','in','Reservation / Approval Data'),F('p2-fa-information','out','Reservation / Approval Information')]},{entity:'dean',flows:[F('p2-de-decision','in','Approval Decision'),F('p2-de-routed','out','Routed Approval Request')]}],
 p3:[{entity:'classrep',flows:[F('p3-cr-inquiry','in','Inquiry'),F('p3-cr-answer','out','Answer')]},{entity:'faculty',flows:[F('p3-fa-inquiry','in','Inquiry'),F('p3-fa-answer','out','Answer')]}],
 p4:[{entity:'classrep',flows:[F('p4-cr-slip','out','Borrowing Slip')]},{entity:'faculty',flows:[F('p4-fa-slip','out','Borrowing Slip')]},{entity:'headlab',flows:[F('p4-he-operations','in','Equipment Lifecycle Data')]},{entity:'physics',flows:[F('p4-ph-operations','in','Equipment Lifecycle Data')]},{entity:'circuits',flows:[F('p4-ci-operations','in','Equipment Lifecycle Data')]}],
 p5:[{entity:'classrep',flows:[F('p5-cr-clearance','out','Clearance Status')]},{entity:'headlab',flows:[F('p5-he-admin','in','Laboratory Administration Data'),F('p5-he-dashboard','out','Laboratory Dashboard'),F('p5-he-report','out','End-Term Report')]},{entity:'physics',flows:[F('p5-ph-activity','in','Laboratory Activity Data'),F('p5-ph-dashboard','out','Laboratory Dashboard')]},{entity:'circuits',flows:[F('p5-ci-activity','in','Laboratory Activity Data'),F('p5-ci-dashboard','out','Laboratory Dashboard')]}]};
/* Entity right-side ports are ordered top-to-bottom by estimated route length.
   The nearest process receives the topmost port; longer routes step downward. */
const entityFlowMeta={};entities.forEach(e=>entityFlowMeta[e.id]=[]);Object.entries(externalGroups).forEach(([pid,groups])=>groups.forEach(g=>g.flows.forEach((f,order)=>entityFlowMeta[g.entity].push({key:f.key,pid,order}))));const entityFlowKeys={};entities.forEach(e=>{const entityCenter=e.y+E.h/2;entityFlowKeys[e.id]=entityFlowMeta[e.id].sort((a,b)=>{const da=Math.abs(entityCenter-(byP[a.pid].y+P.h/2));const db=Math.abs(entityCenter-(byP[b.pid].y+P.h/2));return da-db||a.pid.localeCompare(b.pid)||a.order-b.order}).map(f=>f.key)});const entityPort={};entities.forEach(e=>spread(entityFlowKeys[e.id].length,e.y+23,e.y+E.h-23).forEach((y,i)=>entityPort[entityFlowKeys[e.id][i]]=y));const entityLane={};let entityLaneSeq=0;entities.forEach(e=>{const keys=entityFlowKeys[e.id];keys.forEach((key,index)=>entityLane[key]=880+(entityLaneSeq+keys.length-1-index)*38);entityLaneSeq+=keys.length});
function guideBand(owner,top,bottom,side,color){if(!showGrid)return;const x=side==='left'?E.x+E.w+18:P.x+P.w+18,width=side==='left'?P.x-x:D.x-x-18;guideLayer.appendChild(el('rect',{x,y:top,width,height:bottom-top,fill:color,'fill-opacity':.025,stroke:color,'stroke-opacity':.48,'stroke-width':1.3,'stroke-dasharray':'10 8'}));guideLayer.appendChild(tx(side==='left'?x+8:x+width-8,top+16,[owner],{'font-size':10.5,fill:color,'font-weight':'700','text-anchor':side==='left'?'start':'end'}))}
function routeExternalBands(pid,groups){const p=byP[pid],usableTop=p.y+64,usableBottom=p.y+P.h-34,bandH=(usableBottom-usableTop)/groups.length;groups.forEach((g,gi)=>{const e=byE[g.entity],top=usableTop+gi*bandH,bottom=top+bandH,ports=spread(g.flows.length,top+18,bottom-18);guideBand(g.entity,top,bottom,'left',e.c);g.flows.forEach((f,fi)=>{const sy=entityPort[f.key],py=ports[fi],lane=entityLane[f.key],geometry=[[E.x+E.w,sy],[lane,sy],[lane,py],[P.x,py]],points=f.dir==='in'?geometry:[...geometry].reverse(),wide=Math.abs(lane-(E.x+E.w))>Math.abs(P.x-lane),lx=wide?(E.x+E.w+lane)/2:(lane+P.x)/2,ly=wide?sy:py;arrow(points,f.label,e.c,'a-'+g.entity,pid,lx,ly,f.key)})})}Object.entries(externalGroups).forEach(([pid,groups])=>routeExternalBands(pid,groups));
const storeGroups={
 p1:[{store:'d1',flows:[F('p1-d1-write','write','Account Record'),F('p1-d1-read','read','Account Data')]}],
 p2:[{store:'d2',flows:[F('p2-d2-write','write','Reservation / Approval Record'),F('p2-d2-read','read','Reservation / Approval Data')]},{store:'d3',flows:[F('p2-d3-read','read','Schedule Data')]},{store:'d4',flows:[F('p2-d4-read','read','Item Availability Data')]}],
 p3:[{store:'d8',flows:[F('p3-d8-read','read','Knowledge Content')]},{store:'d9',flows:[F('p3-d9-write','write','Question / Answer Log')]},{store:'d2',flows:[F('p3-d2-read','read','Reservation Status Data')]},{store:'d3',flows:[F('p3-d3-read','read','Schedule Availability Data')]},{store:'d4',flows:[F('p3-d4-read','read','Item Availability Data')]}],
 p4:[{store:'d2',flows:[F('p4-d2-read','read','Authorized Reservation Data'),F('p4-d2-write','write','Reservation Status Update')]},{store:'d4',flows:[F('p4-d4-write','write','Inventory Transaction'),F('p4-d4-read','read','Available Item Data')]},{store:'d5',flows:[F('p4-d5-write','write','Borrowing Slip Record'),F('p4-d5-read','read','Borrowing Slip Data')]},{store:'d10',flows:[F('p4-d10-write','write','Disposal Record')]}],
 p5:[{store:'d2',flows:[F('p5-d2-read','read','Reservation Summary')]},{store:'d3',flows:[F('p5-d3-write','write','Schedule / Usage Record'),F('p5-d3-read','read','Schedule / Usage Data')]},{store:'d4',flows:[F('p5-d4-read','read','Inventory Summary')]},{store:'d5',flows:[F('p5-d5-read','read','Borrowing Summary')]},{store:'d6',flows:[F('p5-d6-write','write','Clearance Record'),F('p5-d6-read','read','Clearance Data')]},{store:'d7',flows:[F('p5-d7-write','write','Daily Task Record'),F('p5-d7-read','read','Daily Task Data')]},{store:'d10',flows:[F('p5-d10-read','read','Disposal Summary')]}]};
const storeFlowKeys={};stores.forEach(s=>storeFlowKeys[s.id]=[]);Object.values(storeGroups).flat().forEach(g=>g.flows.forEach(f=>storeFlowKeys[g.store].push(f.key)));const storePort={};stores.forEach(s=>spread(storeFlowKeys[s.id].length,s.y+15,s.y+D.h-15).forEach((y,i)=>storePort[storeFlowKeys[s.id][i]]=y));const storeLane={};let storeLaneSeq=0;stores.forEach(s=>storeFlowKeys[s.id].forEach(key=>storeLane[key]=3080+(storeLaneSeq++)*21));
function routeStoreBands(pid,groups){const p=byP[pid],usableTop=p.y+64,usableBottom=p.y+P.h-34,bandH=(usableBottom-usableTop)/groups.length;groups.forEach((g,gi)=>{const s=byD[g.store],top=usableTop+gi*bandH,bottom=top+bandH,ports=spread(g.flows.length,top+18,bottom-18);guideBand(g.store,top,bottom,'right',C.store);g.flows.forEach((f,fi)=>{const py=ports[fi],sy=storePort[f.key],lane=storeLane[f.key],geometry=[[P.x+P.w,py],[lane,py],[lane,sy],[D.x,sy]],points=f.dir==='write'?geometry:[...geometry].reverse(),wide=Math.abs(lane-(P.x+P.w))>Math.abs(D.x-lane),lx=wide?(P.x+P.w+lane)/2:(lane+D.x)/2,ly=wide?py:sy;arrow(points,f.label,C.gray,'a-system',pid,lx,ly,f.key)})})}Object.entries(storeGroups).forEach(([pid,groups])=>routeStoreBands(pid,groups));
function entityBox(a){boxLayer.appendChild(el('rect',{x:E.x,y:a.y,width:E.w,height:E.h,rx:12,fill:'#f8fbff',stroke:a.c,'stroke-width':2.4}));boxLayer.appendChild(tx(E.x+E.w/2,a.y+E.h/2,a.name,{'font-size':18,fill:C.ink,'font-weight':'700',lineHeight:22}))}

entities.forEach(entityBox);processes.forEach(processBox);stores.forEach(storeBox);
const note=el('g',{transform:'translate(170,3740)'});note.appendChild(el('rect',{x:0,y:0,width:4160,height:130,rx:12,fill:'#f8fafc',stroke:'#dce4ef','stroke-width':1.3}));note.appendChild(tx(32,33,['Reading guide'],{'font-size':14,fill:C.blue,'font-weight':'700','text-anchor':'start'}));note.appendChild(tx(32,62,['• Entity ports run top-to-bottom from the shortest estimated route to the longest.  •  Hover an arrow to isolate its route.'],{'font-size':13,fill:C.ink,'text-anchor':'start'}));note.appendChild(tx(32,91,['• This guided view groups related boundary records for fast tracing; the Compact Detail version remains the full individual-flow reference.'],{'font-size':13,fill:C.ink,'text-anchor':'start'}));note.appendChild(tx(32,116,['• D1–D10 remain canonical: every data store and external entity appears exactly once in this diagram.'],{'font-size':13,fill:C.ink,'text-anchor':'start'}));svg.appendChild(note);
